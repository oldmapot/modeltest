<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>老娘領地 - 電腦版登入</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
body { 
        font-family: "Microsoft JhengHei", sans-serif; 
        padding: 10px; 
        background: #f4f7f6; 
        margin: 0;
        /* 移除原本的 min-height: 100vh、display: flex、justify-content 與 align-items */
    }
    
/* ===== 登入卡片 ===== */
   .login-card {
    background: white;
    border-radius: 28px;
    padding: 8px 16px; /* <-- 【修改這裡】原本是 12px 16px，縮小上方內距讓空白變少 */
    width: 100%;
    max-width: 820px; /* 控制整體最大寬度剛好 */
    max-height: 80vh;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    margin: auto;
    text-align: left;
}

  .login-content {
    display: flex;
    align-items: center;
    gap: 28px;
}

.login-left {
    flex: 1;
    text-align: center;
}


.login-right {
    flex: 1;
}
    
    /* ===== Logo 區 ===== */
    .logo-img {
        width: 160px;  /* 圖片的寬度為 160 像素 */
        height: 160px;   /* 圖片的高度為 160 像素 */
        border-radius: 50%; /*正方形的四個角圓角化到極致，直接變成一個正圓形 */
        object-fit: cover; /* 確保圖片在塞進這個正圓形框框時，如果原本的圖片比例不是正方形，它會自動裁切掉多餘的部分並填滿整個圓形，不會讓圖片被壓扁或變形 */
        display: inline-block; /* 讓圖片呈現「行內區塊」特性，可以和其他文字或元件並排在同一行，同時又能設定寬高 */
    }
   /* LOGO下方文字 老娘領地 大小 */
    .brand-title {    
        font-size: 26px;
        color: #8b0000;
        font-weight: 700;
        margin-top: 2px; /* <-- 【修改這裡】原本是 6px，調小讓它跟 LOGO 靠近一點 */
    }
    /* LOGO下方文字 電腦版 大小 */
    .pc-badge {  
        display: inline-block;
        background: #8b0000;
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 16px;
        font-weight: bold;
        margin-top: 4px;
    }
    
    /* ===== 右側表單 ===== */
    .login-right h1 {
     font-size: 22px;
    color: #8b0000;
    margin-bottom: 2px;
    font-weight: 700;
}
    
    .subtitle {
        color: #888;
    font-size: 13px;
    margin-bottom: 14px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
}

  .input-group {
    margin-bottom: 10px;
}
    
 
.input-group label {
    display: block;
    margin-bottom: 4px;
    font-weight: 600;
    color: #333;
    font-size: 13px;
}

.input-group input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 15px;
    background: #f9f9f9;
}
    .input-group input:focus {
        outline: none;
        border-color: #8b0000;
        background: white;
        box-shadow: 0 0 0 3px rgba(139,0,0,0.1);
    }
    
    .password-wrapper {
        position: relative;
    }
    
    .toggle-password {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: #999;
    }
   .login-btn {
    width: 100%;
    padding: 12px;
    background: #8b0000;
    color: white;
    border: none;
    border-radius: 24px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 6px;
}
    
    .login-btn:hover {
        background: #a00000;
    }
    
    .login-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
    }
    
    .error-message {
    background: #ffe5e5;
    color: #d00;
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 12px;
    display: none;
    text-align: center;
}
    
    .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2px solid #fff;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        vertical-align: middle;
        margin-right: 8px;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    
    .demo-hint {
    margin-top: 10px;  /*與上方元素保持 12px 的距離（留白）*/
    text-align: left;  /*文字靠左對齊*/
    background: #f5f5f5; /* 背景顏色設定為淺灰色 */
    padding: 10px 12px; /* 內距設定（上下各留 10px、左右各留 12px），讓文字不會貼齊框框邊緣 */
    border-radius: 10px; /* 將框框的四個角變成圓角（半徑 10px） */
    font-size: 12px; /* 字型大小設為 12px */
    color: #666; /* 文字顏色設為深灰色 */
    line-height: 1.6; /* 行高設為 1.6 倍，增加行與行之間的間距 */
}
    
    .demo-hint strong {
        color: #8b0000;
    }
    
    .footer-note {
    margin-top: 14px;
    font-size: 11px;
    color: #999;
    text-align: center;
}
    /* ===== 響應式：小螢幕改回直式 ===== */
    @media (max-width: 640px) {
        .login-card {
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }
        .login-content {
            flex-direction: column;
            gap: 16px;
            text-align: center;
        }
        .login-left {
            flex: 0 0 auto;
        }
        .login-left .logo-img {
            width: 80px;
            height: 80px;
        }
        .login-left .brand-title {  
            font-size: 26px;
        }
        .login-right .subtitle {
            text-align: center;
        }
        .input-group {
            text-align: left;
        }
        .demo-hint {
            text-align: left;
        }
    }
</style>
</head>
<body>
    <div class="login-card">
        <div class="login-content">
            <!-- 左側：Logo + 品牌 -->
<div class="login-left">
    <img src="https://i.postimg.cc/KvytPffF/wei-ming-ming-she-ji-(23).png" class="logo-img">
    <div class="brand-title">老娘領地</div>
    <span class="pc-badge">🖥️ 電腦版</span>
    
    <div class="demo-hint">
        <strong>💡 登入說明：</strong><br>
        • 老娘夥伴限定登入（電腦版）<br>
        • 請使用總部核發的帳號密碼<br>
        • 忘記密碼請聯絡管理員
    </div>
</div>
            
            <!-- 右側：登入表單 -->
            <div class="login-right">
                <h1>夥伴登入</h1>
                <div class="subtitle">請輸入您的帳號與密碼</div>
                
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label>👤 登入帳號</label>
                        <input type="text" id="userId" placeholder="請輸入帳號" required autofocus>
                    </div>
                    <div class="input-group">
                        <label>🔑 登入密碼</label>
                        <div class="password-wrapper">
                            <input type="password" id="keyword" placeholder="請輸入密碼" required>
                            <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                        </div>
                    </div>
                    <button type="submit" class="login-btn" id="loginBtn">🔓 登入系統</button>
                </form>
                
                <div id="errorMsg" class="error-message"></div>
              
                <div class="footer-note">© 老娘領地 夥伴端（電腦版）</div>
            </div>
        </div>
    </div>
    <script>
        // ============================================================
        //  🔥 設定區
        // ============================================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxlvZ-DzBBuZlqudFQF2RWTbVBD5GJwXdV0OYWxemjPaeq7aJxFN19kguOeOeGXLYM4uw/exec";

        // ============================================================
        //  🔥 輔助函數
        // ============================================================
        function togglePassword() {
            const input = document.getElementById('keyword');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function hideError() {
            document.getElementById('errorMsg').style.display = 'none';
        }

        function getDeviceId() {
            let deviceId = localStorage.getItem('pc_device_id');
            if (!deviceId) {
                const screenInfo = `${screen.width}x${screen.height}`;
                const userAgent = navigator.userAgent;
                const timeStamp = Date.now();
                const randomStr = Math.random().toString(36).substring(2, 15);
                deviceId = btoa(`${screenInfo}_${userAgent}_${timeStamp}_${randomStr}`).substring(0, 32);
                localStorage.setItem('pc_device_id', deviceId);
                console.log("📌 產生新的電腦設備 ID:", deviceId);
            }
            return deviceId;
        }

        function getDeviceName() {
            return 'Windows PC';
        }

        // ============================================================
        //  🔥 GAS 預熱
        // ============================================================
        let gasWarmedUp = false;

        async function warmUpGAS() {
            if (gasWarmedUp) return;
            gasWarmedUp = true;
            try {
                console.log("🔥 開始預熱 GAS...");
                fetch(`${GAS_URL}?action=ping&t=${Date.now()}`, { 
                    method: 'GET',
                    mode: 'no-cors'
                });
                console.log("✅ GAS 預熱請求已發送");
            } catch (e) {
                console.log("⚠️ GAS 預熱失敗，不影響登入");
            }
        }

        // ============================================================
        //  🔥 登入請求（含自動重試 1 次）
        // ============================================================
        async function loginWithRetry(verifyUrl) {
            let lastError = null;
            
            for (let attempt = 1; attempt <= 2; attempt++) {
                try {
                    console.log(`📤 登入嘗試 ${attempt}/2`);
                    
                    const response = await fetch(verifyUrl, {
                        method: 'GET',
                        redirect: 'follow'
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const result = await response.json();
                    console.log(`✅ 登入嘗試 ${attempt} 成功`);
                    return result;
                    
                } catch (error) {
                    lastError = error;
                    console.warn(`⚠️ 登入嘗試 ${attempt} 失敗:`, error.message);
                    
                    if (attempt === 1) {
                        console.log("⏳ 1 秒後重試...");
                        await new Promise(resolve => setTimeout(resolve, 1000));
                    }
                }
            }
            
            throw lastError || new Error('所有登入嘗試皆失敗');
        }

        // ============================================================
        //  🔥 核心登入函數（電腦版）
        // ============================================================
        async function handleLogin(event) {
            event.preventDefault();
            
            const userId = document.getElementById('userId').value.trim();
            const keyword = document.getElementById('keyword').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            
            if (!userId || !keyword) {
                showError('請輸入完整的帳號和密碼');
                return;
            }
            
            hideError();
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> 驗證中...';
            
            try {
                // 取得 IP
                let clientIp = '';
                try {
                    const ipRes = await fetch('https://api.ipify.org?format=json');
                    const ipData = await ipRes.json();
                    clientIp = ipData.ip;
                } catch (e) {
                    console.warn('⚠️ 取得 IP 失敗，使用空值');
                }

                const deviceId = getDeviceId();
                const deviceName = getDeviceName();

                // ✅ 電腦版：不傳 lineUid，改用 pc 標記
                const verifyUrl = `${GAS_URL}?action=staffLogin&userId=${encodeURIComponent(userId)}&keyword=${encodeURIComponent(keyword)}&deviceId=${encodeURIComponent(deviceId)}&deviceName=${encodeURIComponent(deviceName)}&clientIp=${encodeURIComponent(clientIp)}&platform=pc&skipLog=true&t=${Date.now()}`;
                
                console.log("📌 電腦版登入請求 URL:", verifyUrl);
                
                const result = await loginWithRetry(verifyUrl);
                
                console.log("📌 後端回傳:", JSON.stringify(result));
                
                if (result.success) {
                    // ✅ 寫入 localStorage
                    localStorage.setItem('staffLoginId', result.loginId || userId);
                    localStorage.setItem('staffName', result.name);
                    localStorage.setItem('staffRole', result.role || '夥伴');
                    localStorage.setItem('staffBranch', '老娘鍋河堤店');
                    localStorage.setItem('pc_device_id', deviceId);
                    
                    // ✅ 跳轉到 staff_pc.html（電腦版）
                    window.location.href = 'staff_pc.html';
                } else {
                    showError(result.message || '帳號或密碼錯誤，請重新輸入');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '登入系統';
                }
                
            } catch (error) {
                console.error('登入失敗:', error);
                showError('⚠️ 系統連線異常，請稍後再試');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '登入系統';
            }
        }

        // ============================================================
        //  ✅ 啟動
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🖥️ 電腦版登入頁啟動');
            
            // ✅ 預熱 GAS
            warmUpGAS();
            
            // ✅ 自動聚焦到帳號輸入框
            document.getElementById('userId').focus();
        });
    </script>
</body>
</html>
