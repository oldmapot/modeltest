<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>火鍋達人 - 老娘鍋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #1a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 9 / 16;
            background: #f5e6d3;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(200, 50, 50, 0.25);
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #f5e6d3;
            touch-action: none;
            cursor: pointer;
        }

        /* ===== 載入畫面 ===== */
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f5e6d3;
            z-index: 30;
            color: #333;
        }
        #loadingScreen .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(139,0,0,0.2);
            border-top: 4px solid #8b0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #loadingScreen p {
            font-size: 16px;
            color: #8b0000;
            letter-spacing: 2px;
        }

        /* ===== 開始畫面 ===== */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.75);
            z-index: 10;
            padding: 24px 20px;
        }

        #startScreen .logo { font-size: 56px; margin-bottom: 4px; }
        #startScreen h1 {
            color: #ffd700;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 2px 20px rgba(255,215,0,0.3);
        }
        #startScreen .subtitle {
            color: #ffaa88;
            font-size: 14px;
            margin-bottom: 12px;
        }

        #startScreen .rules {
            color: #ddd;
            font-size: 18px;
            text-align: center;
            line-height: 2.2;
            background: rgba(255,255,255,0.06);
            padding: 20px 24px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 16px;
            width: 100%;
            max-width: 340px;
        }
        #startScreen .rules .highlight {
            color: #ffd700;
            font-weight: 700;
            font-size: 20px;
        }
        #startScreen .rules .info {
            color: #4fc3f7;
            font-weight: 700;
            font-size: 16px;
        }
        #startScreen .rules .danger {
            color: #ff6b6b;
            font-weight: 700;
        }

        /* 🔥 新增：剩餘次數顯示 */
        .play-info {
            color: #ffaa88;
            font-size: 15px;
            margin-top: 8px;
            text-align: center;
            background: rgba(255,255,255,0.05);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            display: none;
        }

        .btn-start {
            padding: 16px 56px;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff6b35, #e63946);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 24px rgba(230,57,70,0.5);
            transition: all 0.2s ease;
        }
        .btn-start:active { transform: scale(0.95); }
        .btn-start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #playStatus {
            color: #ffaa88;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            min-height: 22px;
        }

        /* ===== 結果畫面 ===== */
        #resultScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            z-index: 20;
            padding: 24px;
        }
        #resultScreen .result-content {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }
        #resultScreen .result-emoji { font-size: 64px; margin-bottom: 4px; }
        #resultScreen .result-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        #resultScreen .result-title.win { color: #ffd700; text-shadow: 0 0 30px rgba(255,215,0,0.4); }
        #resultScreen .result-title.lose { color: #ff6b6b; }
        #resultScreen .result-score {
            color: #fff;
            font-size: 18px;
            margin-bottom: 2px;
        }
        #resultScreen .result-info {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 6px;
        }
        #resultScreen .result-bonus {
            color: #ffd700;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .stars-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 8px 0 12px 0;
        }
        .star-icon {
            font-size: 38px;
            opacity: 0;
            transform: scale(0) rotate(-30deg);
            animation: starBurst 0.5s ease forwards;
        }
        .star-icon:nth-child(1) { animation-delay: 0.1s; }
        .star-icon:nth-child(2) { animation-delay: 0.25s; }
        .star-icon:nth-child(3) { animation-delay: 0.4s; }
        .star-icon:nth-child(4) { animation-delay: 0.55s; }
        .star-icon:nth-child(5) { animation-delay: 0.7s; }
        @keyframes starBurst {
            0% { opacity: 0; transform: scale(0) rotate(-30deg); }
            60% { opacity: 1; transform: scale(1.3) rotate(8deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .btn-retry {
            padding: 14px 44px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            background: #ffd700;
            color: #1a0a0a;
            cursor: pointer;
            margin-top: 4px;
            transition: all 0.2s ease;
        }
        .btn-retry:active { transform: scale(0.95); }

        .btn-replay {
            padding: 12px 36px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s ease;
            display: none;
        }
        .btn-replay:active { transform: scale(0.95); }
        .btn-replay:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* 確認視窗 */
        #confirmOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #confirmBox {
            background: #2d1a1a;
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px 24px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            color: #fff;
        }
        #confirmBox h3 {
            color: #ffd700;
            font-size: 20px;
            margin-bottom: 10px;
        }
        #confirmBox p {
            color: #ddd;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        #confirmBox .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        #confirmBox .btn-group button {
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        #confirmBox .btn-yes { background: #ffd700; color: #1a0a0a; }
        #confirmBox .btn-no { background: #666; color: #fff; }

        /* ===== 浮動文字 ===== */
        .float-text {
            position: fixed;
            font-size: 32px;
            font-weight: 700;
            pointer-events: none;
            animation: floatUp 0.8s ease forwards;
            z-index: 50;
            text-shadow: 0 2px 12px rgba(0,0,0,0.7);
        }
        .float-text.positive { color: #4caf50; }
        .float-text.negative { color: #ff4444; }
        .float-text.special { color: #ffd700; font-size: 40px; }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.2); }
        }

        @media (max-width: 480px) {
            #startScreen h1 { font-size: 24px; }
            #startScreen .rules { font-size: 16px; padding: 14px 16px; }
            .btn-start { padding: 14px 40px; font-size: 18px; }
            #resultScreen .result-title { font-size: 24px; }
            .star-icon { font-size: 30px; }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <!-- 載入畫面 -->
    <div id="loadingScreen">
        <div class="spinner"></div>
        <p>🔥 火鍋準備中...</p>
    </div>

    <!-- 開始畫面 -->
    <div id="startScreen">
        <div class="logo">🍲</div>
        <h1>火鍋達人</h1>
        <div class="subtitle">老娘一點心意 小遊戲</div>
        <div class="rules">
            🎯 目標：接到火鍋食材累積 <span class="highlight" id="thresholdDisplay">50</span> 分<br>
            🎁 獎勵：達成目標獲得 <span class="highlight" id="bonusDisplay">30</span> 點<br>
            <span class="danger">🍰 小心陷阱甜點！</span><br>
            <span class="info">📋 每日免費 <span id="freeDisplay">1</span> 次</span><br>
            <span class="info">💰 可付費玩 <span id="paidDisplay">3</span> 次（每次扣 <span id="costDisplay">5</span> 點）</span>

    </div>

    <!-- 結果畫面 -->
    <div id="resultScreen">
        <div class="result-content">
            <div class="result-emoji" id="resultEmoji">🎉</div>
            <div class="result-title" id="resultTitle">太棒了！</div>
            <div class="result-score" id="resultScore">得分：0 分</div>

            <div id="resultStars" class="stars-container"></div>
            <div class="result-bonus" id="resultBonus"></div>
            <button class="btn-retry" id="retryBtn">🏠 返回</button>

        </div>
    </div>

    <!-- 確認視窗 -->

        <div id="confirmBox">
            <h3>⚠️ 確認</h3>

            <div class="btn-group">
                <button class="btn-yes" id="confirmYes">✅ 確定</button>
                <button class="btn-no" id="confirmNo">❌ 取消</button>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
//  火鍋達人 - 完整版（最終修正）
// ============================================================

// ==================== 設定 ====================
const CONFIG = {
    gameTime: 20,
    threshold: 50,
    bonusPoints: 30,
    maxPlays: 4,
    costPerPlay: 5,
    trapMinCount: 15,
    trapMaxCount: 25,
    spawnInterval: 250,
    potWidth: 80,
    potHeight: 60,
    potY: 0,
    foodSize: 55,
    fallSpeedMin: 2.0,
    fallSpeedMax: 9.0,
};

// ==================== Emoji 對照表（甜點陷阱） ====================
const FOOD_EMOJIS = {
    cabbage: '🥬',
    mushroom: '🍄',
    green_veg: '🥦',
    corn: '🌽',
    carrot: '🥕',
    shrimp: '🦐',
    clam: '🦪',
    meat_1: '🥩',
    meat_2: '🥩',
    lobster: '🦞',
    // 🔥 陷阱是甜點！（煮火鍋放甜點就是陷阱）
    trap_skull: '🧁',
    trap_warning: '🍧',
    trap_bomb: '🧋',
    pot: '🍲'
};

// ==================== 食材定義 ====================
const FOOD_TYPES = [
    { id: 'cabbage', score: 1, weight: 14 },
    { id: 'mushroom', score: 1, weight: 14 },
    { id: 'green_veg', score: 1, weight: 14 },
    { id: 'corn', score: 1, weight: 14 },
    { id: 'carrot', score: 1, weight: 14 },
    { id: 'shrimp', score: 2, weight: 10 },
    { id: 'clam', score: 2, weight: 10 },
    { id: 'meat_1', score: 2, weight: 10 },
    { id: 'meat_2', score: 2, weight: 10 },
    { id: 'lobster', score: 5, weight: 2 },
    { id: 'trap_skull', score: -1, weight: 6 },
    { id: 'trap_warning', score: -1, weight: 6 },
    { id: 'trap_bomb', score: -1, weight: 6 }
];
// ============================================================
//  背景音樂（從 GitHub 載入的 Happy_smile.mp3）
// ============================================================

let bgmAudio = null;
let bgmPlaying = false;
let bgmReady = false;

// 🔥 初始化背景音樂（點擊開始時呼叫）
function initBGM() {
    if (bgmReady) return;
    
    try {
        bgmAudio = new Audio('https://github.com/oldmapot/modeltest/blob/main/Upload%20files/Happy_smile.mp3');
        bgmAudio.loop = true;
        bgmAudio.volume = 0.3;  // 音量 30%
        
        // 預載入音樂
        bgmAudio.load();
        bgmReady = true;
        console.log('🎵 背景音樂已載入');
    } catch(e) {
        console.warn('背景音樂載入失敗:', e);
    }
}

// 🔥 切換靜音（可選功能）
function toggleMute() {
    if (!bgmAudio || !bgmReady) return;
    
    if (bgmAudio.volume > 0) {
        bgmAudio.volume = 0;
        showStatus('🔇 音樂已靜音');
    } else {
        bgmAudio.volume = 0.3;
        showStatus('🔊 音樂已開啟');
    }
}

// ============================================================
//  音效（從 GitHub 載入）
// ============================================================

// 🔥 音效物件
const SFX = {
    foodInPot: null,
    trapInPot: null,
    loaded: false
};

// 🔥 載入音效（在點擊開始時呼叫）
function loadSFX() {
    if (SFX.loaded) return;
    
    try {
        SFX.foodInPot = new Audio('https://github.com/oldmapot/modeltest/blob/main/Upload%20files/%E9%99%B7%E9%98%B1%E5%85%A5%E9%8D%8B.mp3');
        SFX.trapInPot = new Audio('https://github.com/oldmapot/modeltest/blob/main/Upload%20files/%E9%A3%9F%E6%9D%90%E5%85%A5%E9%8D%8B.mp3');
        SFX.loaded = true;
        console.log('🎵 音效已載入');
    } catch(e) {
        console.warn('音效載入失敗:', e);
    }
}

// 🔥 播放食材入鍋音效
function playFoodSFX() {
    if (!SFX.loaded || !SFX.foodInPot) return;
    try {
        SFX.foodInPot.currentTime = 0;  // 重置到開頭
        SFX.foodInPot.play().catch(() => {});
    } catch(e) {}
}

// 🔥 播放陷阱入鍋音效
function playTrapSFX() {
    if (!SFX.loaded || !SFX.trapInPot) return;
    try {
        SFX.trapInPot.currentTime = 0;  // 重置到開頭
        SFX.trapInPot.play().catch(() => {});
    } catch(e) {}
}
// ============================================================
//  聲音系統（手機專用 + 背景音樂）
// ============================================================

function unlockAudio() {
    if (audioUnlocked) return;
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') {
            ctx.resume();
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.001, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.01);
        audioUnlocked = true;
        audioCtx = ctx;
        audioReady = true;
        console.log('🔊 音頻已解鎖');
    } catch(e) {
        console.warn('音頻解鎖失敗:', e);
    }
}

document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('click', unlockAudio, { once: true });

function initAudio() {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        audioReady = true;
        return true;
    } catch (e) {
        return false;
    }
}

function playTone(freq, duration, type = 'sine', vol = 0.3) {
    try {
        if (!audioUnlocked) {
            unlockAudio();
        }
        if (!audioCtx || audioCtx.state !== 'running') {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (!audioCtx || audioCtx.state !== 'running') {
                return;
            }
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
}

// ==================== 遊戲狀態 ====================
let canvas, ctx;
let gameRunning = false;
let gameEnded = false;
let score = 0;
let timeLeft = CONFIG.gameTime;
let potX = 0;
let foods = [];
let floatTexts = [];
let timerInterval = null;
let spawnInterval = null;
let animationId = null;
let trapCount = 0;
let targetTrapCount = 0;
let userId = '';
let GAS_BASE_URL = 'https://script.google.com/macros/s/AKfycbyJHTOyuXMiNX7drQZpjTsQpolrT8isTQTR4HBH05bA-WB_p8Ns1qmBsA6uQel-F60-/exec';
let isWin = false;
let gameResultData = null;
let gameStatus = null;
let trapCooldownTimer = 0;
let foodPool = [];
let resultShown = false;

// ==================== DOM 元素 ====================
const canvasEl = document.getElementById('gameCanvas');
const startScreen = document.getElementById('startScreen');
const resultScreen = document.getElementById('resultScreen');
const startBtn = document.getElementById('startBtn');
const retryBtn = document.getElementById('retryBtn');
const replayBtn = document.getElementById('replayBtn');
const loadingScreen = document.getElementById('loadingScreen');
const playStatus = document.getElementById('playStatus');
const confirmOverlay = document.getElementById('confirmOverlay');
const confirmMessage = document.getElementById('confirmMessage');
const confirmYes = document.getElementById('confirmYes');
const confirmNo = document.getElementById('confirmNo');

// ==================== 初始化 ====================
function init() {
    const params = new URLSearchParams(window.location.search);
    userId = params.get('userId') || '';
    GAS_BASE_URL = params.get('api') || '';

    if (!userId || !GAS_BASE_URL) {
        showStatus('⚠️ 請先登入會員或缺少 API 網址');
        startBtn.disabled = true;
        loadingScreen.style.display = 'none';
        return;
    }

    canvas = canvasEl;
    ctx = canvas.getContext('2d');
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    loadingScreen.style.display = 'none';
    startScreen.style.display = 'flex';
    showStatus('⏳ 載入遊戲設定...');
    
    initFoodPool();
    loadInitialData();

    startBtn.addEventListener('click', fastEnterGame);
    retryBtn.addEventListener('click', goBack);
    replayBtn.addEventListener('click', showConfirmReplay);
    confirmYes.addEventListener('click', confirmReplay);
    confirmNo.addEventListener('click', cancelReplay);

    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
    canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
}

function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;

    const screenWidth = canvas.width;
    const screenHeight = canvas.height;

    CONFIG.potWidth = Math.max(80, screenWidth * 0.28);
    CONFIG.potHeight = CONFIG.potWidth * 0.7;
    CONFIG.potY = screenHeight - CONFIG.potHeight - (screenHeight * 0.08);
    CONFIG.foodSize = Math.max(50, screenWidth * 0.16);

    if (potX === 0) {
        potX = (screenWidth - CONFIG.potWidth) / 2;
    }
}
// 🔥 播放背景音樂（在 fastEnterGame 中呼叫）
function startBGM() {
    if (!bgmReady) {
        initBGM();
    }
    
    if (!bgmAudio || bgmPlaying) return;
    
    try {
        bgmAudio.play();
        bgmPlaying = true;
        console.log('🎵 背景音樂播放中');
    } catch(e) {
        console.warn('背景音樂播放失敗:', e);
        setTimeout(() => {
            if (bgmAudio && !bgmPlaying) {
                bgmAudio.play().catch(() => {});
            }
        }, 1000);
    }
}

// 🔥 暫停背景音樂（遊戲結束時呼叫）
function stopBGM() {
    if (!bgmAudio || !bgmPlaying) return;
    
    try {
        bgmAudio.pause();
        bgmPlaying = false;
        console.log('🎵 背景音樂已暫停');
    } catch(e) {
        console.warn('背景音樂暫停失敗:', e);
    }
}
// ==================== API 呼叫 ====================
function callApi(action, params = {}) {
    const url = new URL(GAS_BASE_URL);
    url.searchParams.set('action', action);
    for (let key in params) {
        url.searchParams.set(key, params[key]);
    }
    return fetch(url.toString())
        .then(res => res.json())
        .catch(err => {
            console.error('API 呼叫失敗:', err);
            return { success: false, message: '網路錯誤' };
        });
}

async function loadInitialData() {
    startBtn.disabled = true;

    try {
        const [configData, statusData] = await Promise.all([
            callApi('getGameConfig'),
            callApi('checkGameStatus', { userId: userId })
        ]);

        if (configData && configData.success) {
            CONFIG.threshold = configData.threshold || CONFIG.threshold;
            CONFIG.bonusPoints = configData.bonusPoints || CONFIG.bonusPoints;
            CONFIG.gameTime = configData.gameTime || CONFIG.gameTime;
            CONFIG.maxPlays = configData.maxPlays || CONFIG.maxPlays;
            CONFIG.costPerPlay = configData.costPerPlay || CONFIG.costPerPlay;

            document.getElementById('thresholdDisplay').textContent = CONFIG.threshold;
            document.getElementById('bonusDisplay').textContent = CONFIG.bonusPoints;
            document.getElementById('gameTimeDisplay').textContent = CONFIG.gameTime;
            document.getElementById('costDisplay').textContent = CONFIG.costPerPlay;
        }

        if (statusData) {
            gameStatus = statusData;
            document.getElementById('freeDisplay').textContent = statusData.freePlay ? '1' : '0';
            document.getElementById('paidDisplay').textContent = statusData.remaining || 0;
            
            if (statusData.available) {
                startBtn.disabled = false;
                let msg = statusData.freePlay ? '🎮 免費遊玩一次！' : '💎 花費 ' + statusData.cost + ' 點再玩一次！';
                showStatus('✅ ' + msg);
            } else {
                startBtn.disabled = true;
                showStatus('⏳ ' + statusData.message);
            }
        }

        initFoodPool();

    } catch (err) {
        console.error('載入失敗:', err);
        showStatus('⚠️ 網路連線失敗，請重新整理');
        startBtn.disabled = true;
    }
}

function submitResult(score, cost) {
    return callApi('recordGameResult', { userId: userId, score: score, cost: cost });
}

// ==================== 食材池 ====================
function initFoodPool() {
    foodPool = [];
    for (let i = 0; i < 3; i++) {
        foodPool.push(...FOOD_TYPES);
    }
    for (let i = foodPool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [foodPool[i], foodPool[j]] = [foodPool[j], foodPool[i]];
    }
}

function selectFoodType() {
    if (foodPool.length === 0) {
        initFoodPool();
    }
    return foodPool.pop();
}

// ==================== 動態難度 ====================
function getDifficultyMultiplier(score) {
    const multiplier = 1 + Math.floor(score / 10) * 0.3;
    return Math.min(multiplier, 2.5);
}

// ==================== 遊戲主邏輯 ====================
function fastEnterGame() {
    if (!gameStatus || !gameStatus.available) {
        showStatus('⚠️ ' + (gameStatus ? gameStatus.message : '今日無法遊玩'));
        return;
    }

    // 立即切換畫面
    startScreen.style.display = 'none';
    resultScreen.style.display = 'none';

    // 🔥 載入音效 + 背景音樂
    loadSFX();        // ← 載入音效
    initBGM();
    startBGM();

    // 重置遊戲
    score = 0;
    timeLeft = CONFIG.gameTime;
    foods = [];
    floatTexts = [];
    trapCount = 0;
    targetTrapCount = Math.floor(Math.random() * (CONFIG.trapMaxCount - CONFIG.trapMinCount + 1)) + CONFIG.trapMinCount;
    trapCooldownTimer = 0;
    resultShown = false;
    
    initFoodPool();
    isWin = false;
    gameEnded = false;
    gameRunning = true;

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);

    if (spawnInterval) clearInterval(spawnInterval);
    spawnInterval = setInterval(spawnFood, CONFIG.spawnInterval);

    if (animationId) cancelAnimationFrame(animationId);
    gameLoop();
}
function updateTimer() {
    timeLeft--;
    if (timeLeft <= 0) {
        timeLeft = 0;
        endGame();
    }
}

function spawnFood() {
    if (!gameRunning || gameEnded) return;

    let foodType = selectFoodType();
    if (!foodType) return;

    // 陷阱控制
    if (foodType.id === 'trap_skull' || foodType.id === 'trap_warning' || foodType.id === 'trap_bomb') {
        if (trapCount >= targetTrapCount) return;
        if (trapCooldownTimer > 0) return;
        trapCount++;
        trapCooldownTimer = 2.0;
    }

    const x = Math.random() * (canvas.width - CONFIG.foodSize);
    
    // 速度隨機
    const r = Math.random();
    let speed;
    if (r < 0.15) {
        speed = 7.5 + Math.random() * 2.0;
    } else if (r < 0.40) {
        speed = 5.0 + Math.random() * 2.5;
    } else {
        speed = 3.0 + Math.random() * 2.0;
    }

    // 套用難度倍率
    const multiplier = getDifficultyMultiplier(score);
    const finalSpeed = speed * multiplier;

    foods.push({
        type: foodType,
        x: x,
        y: -CONFIG.foodSize,
        size: CONFIG.foodSize,
        speed: Math.min(finalSpeed, 12),
    });

    // 有機率多掉一個
    if (Math.random() < 0.15 * multiplier) {
        const x2 = Math.random() * (canvas.width - CONFIG.foodSize);
        const speed2 = (speed * 0.8 + Math.random() * 0.5) * multiplier;
        foods.push({
            type: selectFoodType(),
            x: x2,
            y: -CONFIG.foodSize,
            size: CONFIG.foodSize,
            speed: Math.min(speed2, 12),
        });
    }
}

function gameLoop() {
    if (!gameRunning) return;
    if (gameEnded) { draw(); return; }
    update();
    draw();
    animationId = requestAnimationFrame(gameLoop);
}

function update() {
    if (trapCooldownTimer > 0) {
        trapCooldownTimer -= 1/60;
        if (trapCooldownTimer < 0) trapCooldownTimer = 0;
    }
    
    const potBottom = CONFIG.potY + CONFIG.potHeight;
    for (let i = foods.length - 1; i >= 0; i--) {
        const food = foods[i];
        food.y += food.speed;

        if (food.y + food.size > potBottom &&
            food.y + food.size < potBottom + 20 &&
            food.x + food.size > potX &&
            food.x < potX + CONFIG.potWidth) {

            const change = food.type.score;
            score += change;
            
            const id = food.type.id;
            if (id === 'lobster') {
                // 龍蝦用原本的 Web Audio 音效（比較特別）
                playLobsterInPot();
            } else if (id === 'trap_skull' || id === 'trap_warning' || id === 'trap_bomb') {
                playTrapSFX();   // 🔥 改用新的陷阱音效
            } else {
                playFoodSFX();   // 🔥 改用新的食材音效
            }
            
            showFloatText(food.x + food.size/2, food.y, change, food.type.id === 'lobster');
            foods.splice(i, 1);
            continue;
        }

        if (food.y > canvas.height + 20) {
            foods.splice(i, 1);
        }
    }
}
// ===== 龍蝦入鍋音效（合成） =====
function playLobsterInPot() {
    playTone(1000, 0.1, 'sine', 0.35);
    setTimeout(() => playTone(1400, 0.1, 'sine', 0.35), 100);
    setTimeout(() => playTone(1800, 0.15, 'sine', 0.35), 200);
}

// ===== 達標成功音效 =====
function playSuccessSound() {
    const notes = [523, 659, 784, 1047];
    notes.forEach((freq, i) => {
        setTimeout(() => playTone(freq, 0.15, 'sine', 0.3), i * 100);
    });
    setTimeout(() => {
        [523, 659, 784].forEach((freq, i) => {
            setTimeout(() => playTone(freq, 0.3, 'sine', 0.25), i * 60);
        });
    }, 450);
}

// ===== 失敗音效 =====
function playFailSound() {
    playTone(350, 0.3, 'sawtooth', 0.25);
    setTimeout(() => playTone(250, 0.4, 'sawtooth', 0.25), 150);
    setTimeout(() => playTone(150, 0.5, 'sawtooth', 0.2), 350);
}
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, '#f5e6d3');
    gradient.addColorStop(0.5, '#e8d5c4');
    gradient.addColorStop(1, '#f5e6d3');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(180, 140, 100, 0.15)';
    for (let i = 0; i < 20; i++) {
        const dotX = Math.random() * canvas.width;
        const dotY = Math.random() * canvas.height;
        ctx.beginPath();
        ctx.arc(dotX, dotY, Math.random() * 3 + 1, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let food of foods) {
        const emoji = FOOD_EMOJIS[food.type.id] || '❓';
        const fontSize = food.size * 1.0;
        ctx.font = fontSize + 'px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.shadowBlur = 8;
        ctx.fillText(emoji, food.x + food.size/2, food.y + food.size/2);
        ctx.shadowBlur = 0;
    }

    const potSize = CONFIG.potWidth * 0.85;
    ctx.font = potSize + 'px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 12;
    ctx.fillText(FOOD_EMOJIS.pot, potX + CONFIG.potWidth/2, CONFIG.potY + CONFIG.potHeight/2 + 2);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.beginPath();
    ctx.ellipse(potX + CONFIG.potWidth/2, CONFIG.potY + CONFIG.potHeight + 4, CONFIG.potWidth/2.2, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    roundRect(ctx, 10, 10, 150, 58, 14, true, false);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 17px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.shadowBlur = 0;
    ctx.fillText(`🏆 ${score} 分`, 22, 18);
    ctx.fillStyle = '#ffd700';
    ctx.fillText(`⏱️ ${timeLeft}s`, 22, 42);

    for (let i = floatTexts.length - 1; i >= 0; i--) {
        const ft = floatTexts[i];
        ft.y -= 1.8;
        ft.life -= 0.025;
        if (ft.life <= 0) {
            ft.el.remove();
            floatTexts.splice(i, 1);
            continue;
        }
        ft.el.style.top = ft.y + 'px';
        ft.el.style.left = ft.x + 'px';
        ft.el.style.opacity = ft.life;
        ft.el.style.transform = `scale(${1 + (1 - ft.life) * 0.3})`;
    }
}

function roundRect(ctx, x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
}

function showFloatText(x, y, change, isSpecial) {
    const el = document.createElement('div');
    el.className = 'float-text';
    if (change > 0) el.classList.add('positive');
    else if (change < 0) el.classList.add('negative');
    if (isSpecial) el.classList.add('special');

    const sign = change > 0 ? '+' : '';
    el.textContent = sign + change;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const absX = (x / scaleX) + rect.left;
    const absY = (y / scaleY) + rect.top;

    el.style.left = absX + 'px';
    el.style.top = absY + 'px';
    document.body.appendChild(el);

    floatTexts.push({
        el: el,
        x: absX,
        y: absY,
        life: 1.0
    });
}

// ==================== 遊戲結束 ====================
function endGame() {
    if (gameEnded) return;
    gameEnded = true;
    gameRunning = false;

    stopBGM();

    if (timerInterval) clearInterval(timerInterval);
    if (spawnInterval) clearInterval(spawnInterval);
    if (animationId) cancelAnimationFrame(animationId);

    // 🔥 除錯資訊
    const debugInfo = {
        gameStatus: gameStatus,
        freePlay: gameStatus?.freePlay,
        cost: gameStatus && !gameStatus.freePlay ? CONFIG.costPerPlay : 0
    };
    console.log('📊 除錯資訊:', JSON.stringify(debugInfo));

    // 🔥 結果畫面
    resultScreen.style.display = 'flex';
    
    document.getElementById('resultEmoji').textContent = '⏳';
    document.getElementById('resultTitle').textContent = '計算中...';
    document.getElementById('resultTitle').className = 'result-title';
    document.getElementById('resultScore').textContent = `得分：${score} 分`;
    document.getElementById('resultInfo').textContent = '請稍候...';
    document.getElementById('resultBonus').textContent = '';
    document.getElementById('resultStars').innerHTML = '';
    replayBtn.style.display = 'none';

    isWin = score >= CONFIG.threshold;
    const cost = gameStatus && !gameStatus.freePlay ? CONFIG.costPerPlay : 0;
    
    console.log('📊 最終 cost:', cost, '類型:', typeof cost);

    if (isWin) {
        playSuccessSound();
    } else {
        playFailSound();
    }

    submitResult(score, cost).then(data => {
        gameResultData = data;
        console.log('📊 submitResult 回傳:', data);
        setTimeout(() => {
            showResult(data);
        }, 2000);
    }).catch((err) => {
        console.error('❌ submitResult 錯誤:', err);
        setTimeout(() => {
            showResult({ success: false, message: '網路錯誤' });
        }, 2000);
    });
}

function showResult(data) {
    const emoji = document.getElementById('resultEmoji');
    const title = document.getElementById('resultTitle');
    const scoreEl = document.getElementById('resultScore');
    const infoEl = document.getElementById('resultInfo');
    const bonusEl = document.getElementById('resultBonus');
    const stars = document.getElementById('resultStars');

    const isWinLocal = isWin && data.success;
    const remaining = data.remaining || 0;

    stars.innerHTML = '';

    if (isWinLocal) {
        emoji.textContent = '🎉';
        title.textContent = '太棒了！達標！';
        title.className = 'result-title win';
        scoreEl.textContent = `得分：${score} 分`;
        infoEl.textContent = '';
        bonusEl.textContent = `🎁 獲得 ${CONFIG.bonusPoints} 點！`;
        
        for (let i = 0; i < 5; i++) {
            const span = document.createElement('span');
            span.className = 'star-icon';
            span.textContent = '⭐';
            stars.appendChild(span);
        }
        replayBtn.style.display = 'none';
        
    } else if (isWin && !data.success) {
        emoji.textContent = '⚠️';
        title.textContent = '達標但儲存失敗';
        title.className = 'result-title lose';
        scoreEl.textContent = `得分：${score} 分`;
        infoEl.textContent = data.message || '請截圖分數畫面，聯絡客服';
        bonusEl.textContent = '';
        replayBtn.style.display = 'none';
        
    } else {
        emoji.textContent = '😅';
        title.textContent = '再接再厲！';
        title.className = 'result-title lose';
        scoreEl.textContent = `得分：${score} 分 / 目標：${CONFIG.threshold} 分`;
        infoEl.textContent = data.success ? `剩餘可用次數：${remaining}` : data.message || '';
        bonusEl.textContent = '💪 差一點就達標了！';

        if (data.success && remaining > 0 && CONFIG.costPerPlay > 0) {
            replayBtn.style.display = 'inline-block';
            replayBtn.textContent = `🔄 再玩一次（扣 ${CONFIG.costPerPlay} 點）`;
            replayBtn.disabled = false;
        } else {
            replayBtn.style.display = 'none';
        }
    }
}

// ==================== 再玩一次 ====================
function showConfirmReplay() {
    const cost = CONFIG.costPerPlay;
    confirmMessage.textContent = `是否花費 ${cost} 點再玩一次？\n（今日剩餘可用次數：${gameResultData?.remaining || 0}）`;
    confirmOverlay.style.display = 'flex';
}

function confirmReplay() {
    confirmOverlay.style.display = 'none';
    callApi('checkGameStatus', { userId: userId }).then(data => {
        gameStatus = data;
        if (data.available) {
            resultScreen.style.display = 'none';
            startScreen.style.display = 'flex';
            startBtn.disabled = false;
            let msg = data.freePlay ? '🎮 免費遊玩一次！' : '💎 花費 ' + data.cost + ' 點再玩一次！';
            showStatus('✅ ' + msg);
        } else {
            showStatus('⏳ ' + data.message);
            replayBtn.style.display = 'none';
        }
    }).catch(() => {
        showStatus('⚠️ 無法連線到伺服器');
    });
}

function cancelReplay() {
    confirmOverlay.style.display = 'none';
}

// ==================== 控制 ====================
function handleMove(e) {
    if (!gameRunning) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    potX = Math.max(0, Math.min(x - CONFIG.potWidth/2, canvas.width - CONFIG.potWidth));
}

function handleTouchMove(e) {
    e.preventDefault();
    if (!gameRunning) return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
    potX = Math.max(0, Math.min(x - CONFIG.potWidth/2, canvas.width - CONFIG.potWidth));
}

function handleTouchStart(e) {
    e.preventDefault();
    if (!gameRunning) return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
    potX = Math.max(0, Math.min(x - CONFIG.potWidth/2, canvas.width - CONFIG.potWidth));
}

function showStatus(msg) {
    playStatus.textContent = msg;
}

function goBack() {
    var memberPageUrl = 'https://oldmapot.github.io/modeltest/index.html';
    if (userId) {
        memberPageUrl += '?userId=' + encodeURIComponent(userId);
    }
    window.location.href = memberPageUrl;
}

// ==================== 啟動 ====================
document.addEventListener('DOMContentLoaded', init);
</script>
