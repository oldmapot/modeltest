<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>火鍋達人 - 老娘鍋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #1a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 9 / 16;
            background: #2d1a1a;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(200, 50, 50, 0.25);
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #2d1a1a;
            touch-action: none;
            cursor: pointer;
        }

        /* ===== 載入畫面 ===== */
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #2d1a1a;
            z-index: 30;
            color: #fff;
        }
        #loadingScreen .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,215,0,0.2);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #loadingScreen p {
            font-size: 14px;
            color: #ffaa88;
            letter-spacing: 2px;
        }

        /* ===== 開始畫面 ===== */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.8);
            z-index: 10;
            padding: 24px 20px;
        }

        #startScreen .logo {
            font-size: 56px;
            margin-bottom: 4px;
        }
        #startScreen h1 {
            color: #ffd700;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 2px 20px rgba(255,215,0,0.3);
        }
        #startScreen .subtitle {
            color: #ffaa88;
            font-size: 14px;
            margin-bottom: 12px;
        }

        #startScreen .rules {
    color: #ddd;
    font-size: 18px;          /* 🔥 13px → 18px */
    text-align: center;
    line-height: 2.2;         /* 🔥 1.9 → 2.2（行距也調大） */
    background: rgba(255,255,255,0.06);
    padding: 20px 24px;       /* 🔥 內邊距也調大 */
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    margin-bottom: 16px;
    width: 100%;
    max-width: 340px;
}
#startScreen .rules .highlight {
    color: #ffd700;
    font-weight: 700;
    font-size: 20px;          /* 🔥 突出顯示的數字再大一點 */
}
#startScreen .rules .danger {
    color: #ff6b6b;
    font-weight: 700;
}
#startScreen .rules .info {
    color: #4fc3f7;
    font-weight: 700;
    font-size: 16px;          /* 🔥 訊息文字稍微放大 */
}

        .btn-start {
            padding: 16px 56px;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff6b35, #e63946);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 24px rgba(230,57,70,0.5);
            transition: all 0.2s ease;
        }
        .btn-start:active { transform: scale(0.95); }
        .btn-start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #playStatus {
            color: #ffaa88;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            min-height: 22px;
        }

        /* ===== 結果畫面 ===== */
        #resultScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            z-index: 20;
            padding: 24px;
        }
        #resultScreen .result-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.2;
        }
        #resultScreen .result-content {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }
        #resultScreen .result-emoji { font-size: 64px; margin-bottom: 4px; }
        #resultScreen .result-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        #resultScreen .result-title.win { color: #ffd700; text-shadow: 0 0 30px rgba(255,215,0,0.4); }
        #resultScreen .result-title.lose { color: #ff6b6b; }
        #resultScreen .result-score {
            color: #fff;
            font-size: 18px;
            margin-bottom: 2px;
        }
        #resultScreen .result-info {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 6px;
        }
        #resultScreen .result-bonus {
            color: #ffd700;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .stars-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 8px 0 12px 0;
        }
        .star-icon {
            font-size: 38px;
            opacity: 0;
            transform: scale(0) rotate(-30deg);
            animation: starBurst 0.5s ease forwards;
        }
        .star-icon:nth-child(1) { animation-delay: 0.1s; }
        .star-icon:nth-child(2) { animation-delay: 0.25s; }
        .star-icon:nth-child(3) { animation-delay: 0.4s; }
        .star-icon:nth-child(4) { animation-delay: 0.55s; }
        .star-icon:nth-child(5) { animation-delay: 0.7s; }
        @keyframes starBurst {
            0% { opacity: 0; transform: scale(0) rotate(-30deg); }
            60% { opacity: 1; transform: scale(1.3) rotate(8deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .btn-retry {
            padding: 14px 44px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            background: #ffd700;
            color: #1a0a0a;
            cursor: pointer;
            margin-top: 4px;
            transition: all 0.2s ease;
        }
        .btn-retry:active { transform: scale(0.95); }
        .btn-retry:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 再玩一次按鈕（扣點） */
        .btn-replay {
            padding: 12px 36px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s ease;
        }
        .btn-replay:active { transform: scale(0.95); }
        .btn-replay:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* 確認視窗 */
        #confirmOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #confirmBox {
            background: #2d1a1a;
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px 24px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            color: #fff;
        }
        #confirmBox h3 {
            color: #ffd700;
            font-size: 20px;
            margin-bottom: 10px;
        }
        #confirmBox p {
            color: #ddd;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        #confirmBox .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        #confirmBox .btn-group button {
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        #confirmBox .btn-yes {
            background: #ffd700;
            color: #1a0a0a;
        }
        #confirmBox .btn-no {
            background: #666;
            color: #fff;
        }

        /* ===== 浮動文字 ===== */
        .float-text {
            position: fixed;
            font-size: 28px;
            font-weight: 700;
            pointer-events: none;
            animation: floatUp 0.8s ease forwards;
            z-index: 50;
            text-shadow: 0 2px 12px rgba(0,0,0,0.7);
        }
        .float-text.positive { color: #4caf50; }
        .float-text.negative { color: #ff4444; }
        .float-text.special { color: #ffd700; font-size: 36px; }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.2); }
        }

        @media (max-width: 480px) {
            #startScreen h1 { font-size: 24px; }
            #startScreen .rules { font-size: 12px; padding: 12px 14px; }
            .btn-start { padding: 14px 40px; font-size: 18px; }
            #resultScreen .result-title { font-size: 24px; }
            .star-icon { font-size: 30px; }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <!-- 載入畫面 -->
    <div id="loadingScreen">
        <div class="spinner"></div>
        <p>🔥 火鍋準備中...</p>
    </div>

    <!-- 開始畫面 -->
    <div id="startScreen">
        <div class="logo">🍲</div>
        <h1>火鍋達人</h1>
        <div class="subtitle">老娘鍋 獨家小遊戲</div>
        <div class="rules">
            ⏱️ 時間：<span class="highlight" id="gameTimeDisplay">20</span> 秒<br>
            🎯 目標：接到食材累積 <span class="highlight" id="thresholdDisplay">50</span> 分<br>
            🎁 獎勵：達成目標獲得 <span class="highlight" id="bonusDisplay">30</span> 點<br>
            ⚠️ 陷阱會扣分！<br>
            <span class="info">📋 每日免費 1 次，後續每次扣 <span id="costDisplay">5</span> 點</span>
        </div>
        <button class="btn-start" id="startBtn">🔥 開始遊戲</button>
        <div id="playStatus"></div>
    </div>

    <!-- 結果畫面 -->
    <div id="resultScreen">
        <div class="result-bg" id="resultBg"></div>
        <div class="result-content">
            <div class="result-emoji" id="resultEmoji">🎉</div>
            <div class="result-title" id="resultTitle">太棒了！</div>
            <div class="result-score" id="resultScore">得分：0 分</div>
            <div class="result-info" id="resultInfo"></div>
            <div id="resultStars" class="stars-container"></div>
            <div class="result-bonus" id="resultBonus"></div>
           <button class="btn-retry" id="retryBtn">🏠 返回</button>
            <button class="btn-replay" id="replayBtn" style="display:none;">🔄 再玩一次（扣 5 點）</button>
        </div>
    </div>

    <!-- 確認視窗 -->
    <div id="confirmOverlay">
        <div id="confirmBox">
            <h3>⚠️ 確認</h3>
            <p id="confirmMessage">是否花費 5 點再玩一次？</p>
            <div class="btn-group">
                <button class="btn-yes" id="confirmYes">✅ 確定</button>
                <button class="btn-no" id="confirmNo">❌ 取消</button>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
//  火鍋達人 - 完整遊戲邏輯
// ============================================================

// ==================== 設定 ====================
const CONFIG = {
    gameTime: 20,
    threshold: 50,
    bonusPoints: 30,
    maxPlays: 3,
    costPerPlay: 5,
    trapMinCount: 10,
    trapMaxCount: 15,
    spawnInterval: 400,           // 🔥 生成間隔縮短（550→400），食材更多
    potWidth: 80,
    potHeight: 60,
    potY: 0,
    foodSize: 50,
    fallSpeedMin: 2.8,            // 🔥 最低速度提高（1.8→2.8）
    fallSpeedMax: 4.8,            // 🔥 最高速度提高（3.8→4.8）
};

// ==================== 圖片素材 ====================
// 修正後的 13 張圖片對應
const IMAGES = {
  // 🥦 蔬菜 +1 分
  cabbage: "https://i.ibb.co/MH2cTLP/1.png",      // 高麗菜
  mushroom: "https://i.ibb.co/Nnsm5ZzR/10.png",    // 香菇
  green_veg: "https://i.ibb.co/tMnnN12F/9.png",   // 青菜
  corn: "https://i.ibb.co/gbKF4gvH/8.png",        // 玉米
  carrot: "https://i.ibb.co/C5Hdjw02/7.png",      // 蘿蔔

  // 🦐 海鮮 +2 分
  shrimp: "https://i.ibb.co/vCXrXYSj/2.png",      // 蝦子
  clam: "https://i.ibb.co/pBfpgF5K/6.png",        // 蛤蜊

  // 🥩 肉片 +2 分
  meat_1: "https://i.ibb.co/20gx6QW8/14.png",     // 肉片 A
  meat_2: "https://i.ibb.co/Fbysf7px/12.png",     // 肉片 B

  // 🦞 稀有龍蝦 +10 分
  lobster: "https://i.ibb.co/gF6RBgVD/11.png",    // 龍蝦 (專屬圖片)

  // 🦴 陷阱 -1 分
  trap_fish: "https://i.ibb.co/htjq96p/5.png",    // 魚骨
  trap_chicken: "https://i.ibb.co/pjTCDG2q/4.png", // 雞骨
  trap_egg: "https://i.ibb.co/DDhXytbf/3.png"     // 破蛋殼
};

// ==================== 食材定義 ====================
const FOOD_TYPES = [
  // 蔬菜類 (+1分)
  { type: 'cabbage', score: 1, weight: 15 },
  { type: 'mushroom', score: 1, weight: 15 },
  { type: 'green_veg', score: 1, weight: 15 },
  { type: 'corn', score: 1, weight: 15 },
  { type: 'carrot', score: 1, weight: 15 },

  // 海鮮與肉片 (+2分)
  { type: 'shrimp', score: 2, weight: 10 },
  { type: 'clam', score: 2, weight: 10 },
  { type: 'meat_1', score: 2, weight: 10 },
  { type: 'meat_2', score: 2, weight: 10 },

  // 陷阱類 (-1分)
  { type: 'trap_fish', score: -1, weight: 5 },
  { type: 'trap_chicken', score: -1, weight: 5 },
  { type: 'trap_egg', score: -1, weight: 5 },

  // 龍蝦 (+10分) - 獨立處理，不放在常規抽籤權重中
  { type: 'lobster', score: 10, weight: 0 }
];

// ==================== 遊戲狀態 ====================
let canvas, ctx;
let gameRunning = false;
let gameEnded = false;
let score = 0;
let timeLeft = CONFIG.gameTime;
let potX = 0;
let foods = [];
let floatTexts = [];
let timerInterval = null;
let spawnInterval = null;
let animationId = null;
let lobsterSpawned = false;      // 是否已出現過
let lobsterSpawnTime = 0;        // 龍蝦出現的時間（用於計算間隔）
let lobsterMaxCount = 2;         // 整場最多出現 1 次（或 2 次）
let trapCount = 0;
let targetTrapCount = 0;
let imagesLoaded = false;
let userId = '';
let GAS_BASE_URL = 'https://script.google.com/macros/s/AKfycbyJHTOyuXMiNX7drQZpjTsQpolrT8isTQTR4HBH05bA-WB_p8Ns1qmBsA6uQel-F60-/exec';
let isWin = false;
let gameResultData = null;
let gameStatus = null; // 儲存遊戲狀態（免費/付費）
let trapCooldownTimer = 0;  // 陷阱冷卻計時器
let foodPool = [];          // 洗牌食材池

// ==================== DOM 元素 ====================
const canvasEl = document.getElementById('gameCanvas');
const startScreen = document.getElementById('startScreen');
const resultScreen = document.getElementById('resultScreen');
const startBtn = document.getElementById('startBtn');
const retryBtn = document.getElementById('retryBtn');
const replayBtn = document.getElementById('replayBtn');
const loadingScreen = document.getElementById('loadingScreen');
const playStatus = document.getElementById('playStatus');
const confirmOverlay = document.getElementById('confirmOverlay');
const confirmMessage = document.getElementById('confirmMessage');
const confirmYes = document.getElementById('confirmYes');
const confirmNo = document.getElementById('confirmNo');

// ==================== 初始化 ====================
function init() {
    const params = new URLSearchParams(window.location.search);
    userId = params.get('userId') || '';
    GAS_BASE_URL = params.get('api') || '';

    if (!userId) {
        showStatus('⚠️ 請先登入會員');
        startBtn.disabled = true;
        loadingScreen.style.display = 'none';
        return;
    }

    if (!GAS_BASE_URL) {
        showStatus('⚠️ 缺少 API 網址');
        startBtn.disabled = true;
        loadingScreen.style.display = 'none';
        return;
    }

    canvas = canvasEl;
    ctx = canvas.getContext('2d');
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

   loadAllImages(async () => {
    loadingScreen.style.display = 'none';
    // 🔥 改為同步並行請求，省去一半 API 等待時間
    await loadInitialData();
});
    startBtn.addEventListener('click', startGame);
    retryBtn.addEventListener('click', goBack);
    replayBtn.addEventListener('click', showConfirmReplay);
    confirmYes.addEventListener('click', confirmReplay);
    confirmNo.addEventListener('click', cancelReplay);

    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
    canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
}

function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;

    const screenWidth = canvas.width;
    const screenHeight = canvas.height;

    // 🔥 鍋子放大（螢幕寬度 28%）
    CONFIG.potWidth = Math.max(80, screenWidth * 0.28);
    CONFIG.potHeight = CONFIG.potWidth * 0.7;
    CONFIG.potY = screenHeight - CONFIG.potHeight - (screenHeight * 0.08);
    
    // 🔥 食材放大（螢幕寬度 16%）
    CONFIG.foodSize = Math.max(50, screenWidth * 0.16);

    if (potX === 0) {
        potX = (screenWidth - CONFIG.potWidth) / 2;
    }
}

// ==================== 圖片載入 ====================
function loadAllImages(callback) {
    const keys = Object.keys(IMAGES);
    let loaded = 0;
    const total = keys.length;

    for (let key of keys) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = IMAGES[key];
        img.onload = () => {
            IMAGES[key + '_img'] = img;
            loaded++;
            if (loaded === total) { imagesLoaded = true; if (callback) callback(); }
        };
        img.onerror = () => {
            console.warn('⚠️ 圖片載入失敗:', key);
            IMAGES[key + '_img'] = null;
            loaded++;
            if (loaded === total) { imagesLoaded = true; if (callback) callback(); }
        };
    }
}

// ==================== API 呼叫 ====================
async function loadInitialData() {
    showStatus('⏳ 載入遊戲資料與狀態...');
    startBtn.disabled = true;

    try {
        // 🔥 Promise.all 同步並行發送
        const [configData, statusData] = await Promise.all([
            callApi('getGameConfig'),
            callApi('checkGameStatus', { userId: userId })
        ]);

        // 1. 寫回 CONFIG 並更新畫面顯示
        if (configData && configData.success) {
            CONFIG.threshold = configData.threshold || CONFIG.threshold;
            CONFIG.bonusPoints = configData.bonusPoints || CONFIG.bonusPoints;
            CONFIG.gameTime = configData.gameTime || CONFIG.gameTime;
            CONFIG.maxPlays = configData.maxPlays || CONFIG.maxPlays;
            CONFIG.costPerPlay = configData.costPerPlay || CONFIG.costPerPlay;

            document.getElementById('thresholdDisplay').textContent = CONFIG.threshold;
            document.getElementById('bonusDisplay').textContent = CONFIG.bonusPoints;
            document.getElementById('gameTimeDisplay').textContent = CONFIG.gameTime;
            document.getElementById('costDisplay').textContent = CONFIG.costPerPlay;
        }

        // 2. 更新遊戲狀態 (gameStatus)
        if (statusData) {
            gameStatus = statusData;
            if (statusData.available) {
                startBtn.disabled = false;
                let msg = statusData.freePlay ? '🎮 免費遊玩一次！' : '💎 花費 ' + statusData.cost + ' 點再玩一次！';
                showStatus('✅ ' + msg);
            } else {
                startBtn.disabled = true;
                showStatus('⏳ ' + statusData.message);
            }
        }
    } catch (err) {
        console.error('載入失敗:', err);
        showStatus('⚠️ 網路連線失敗，請重新整理');
        startBtn.disabled = true;
    }
}
function callApi(action, params = {}) {
    const url = new URL(GAS_BASE_URL);
    url.searchParams.set('action', action);
    for (let key in params) {
        url.searchParams.set(key, params[key]);
    }
    return fetch(url.toString())
        .then(res => res.json())
        .catch(err => {
            console.error('API 呼叫失敗:', err);
            return { success: false, message: '網路錯誤' };
        });
}

function fetchGameConfig() {
    callApi('getGameConfig').then(data => {
        if (data.success) {
            CONFIG.threshold = data.threshold || 50;
            CONFIG.bonusPoints = data.bonusPoints || 30;
            CONFIG.gameTime = data.gameTime || 20;
            CONFIG.maxPlays = data.maxPlays || 3;
            CONFIG.costPerPlay = data.costPerPlay || 5;
            document.getElementById('thresholdDisplay').textContent = CONFIG.threshold;
            document.getElementById('bonusDisplay').textContent = CONFIG.bonusPoints;
            document.getElementById('gameTimeDisplay').textContent = CONFIG.gameTime;
            document.getElementById('costDisplay').textContent = CONFIG.costPerPlay;
        }
    }).catch(() => {});
}

function checkGameStatus() {
    // 🔥 1. 先顯示「載入中」，並禁用按鈕
    showStatus('⏳ 檢查遊戲狀態...');
    startBtn.disabled = true;
    
    // 🔥 2. 呼叫 API
    callApi('checkGameStatus', { userId: userId })
        .then(data => {
            gameStatus = data;
            console.log('📊 遊戲狀態:', data); // 方便除錯
            
            if (data.available) {
                startBtn.disabled = false;
                let msg = data.freePlay ? '🎮 免費遊玩一次！' : '💎 花費 ' + data.cost + ' 點再玩一次！';
                showStatus('✅ ' + msg);
            } else {
                startBtn.disabled = true;
                showStatus('⏳ ' + data.message);
            }
        })
        .catch(err => {
            console.error('檢查遊戲狀態失敗:', err);
            showStatus('⚠️ 無法連線到伺服器');
            startBtn.disabled = true;
        });
}

function submitResult(score, cost) {
    return callApi('recordGameResult', { userId: userId, score: score, cost: cost });
}

// ==================== 遊戲主邏輯 ====================
function startGame() {
    if (gameRunning || !imagesLoaded) return;

    if (!gameStatus || !gameStatus.available) {
        showStatus('⚠️ ' + (gameStatus ? gameStatus.message : '今日無法遊玩'));
        return;
    }

    // 重置遊戲變數
    score = 0;
    timeLeft = CONFIG.gameTime;
    foods = [];
    floatTexts = [];
    
    // 重置特殊食材與陷阱控管
    lobsterSpawned = false; // 重置龍蝦出現狀態 (確保一局最多 1 次)
    trapCount = 0;
    targetTrapCount = Math.floor(Math.random() * (CONFIG.trapMaxCount - CONFIG.trapMinCount + 1)) + CONFIG.trapMinCount;
    
    // 🔑🔥 【關鍵新增】初始化並洗牌食材池，防止連續掉落同種食材
    if (typeof initFoodPool === 'function') {
        initFoodPool();
    }

    isWin = false;
    gameEnded = false;
    gameRunning = true;

    // 隱藏選單與結算畫面
    startScreen.style.display = 'none';
    resultScreen.style.display = 'none';

    // 啟動倒數計時器
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);

    // 啟動食材生成器
    if (spawnInterval) clearInterval(spawnInterval);
    spawnInterval = setInterval(spawnFood, CONFIG.spawnInterval);

    // 啟動 Canvas 繪製迴圈
    if (animationId) cancelAnimationFrame(animationId);
    gameLoop();
}
// 初始化並打散食材池 (確保種類交錯不連刷)
function initFoodPool() {
  const normalFoods = FOOD_TYPES.filter(f => f.type !== 'lobster');
  foodPool = [];
  // 複製 3 組一般食材並打散
  for (let i = 0; i < 3; i++) {
    foodPool.push(...normalFoods);
  }
  // 洗牌 (Fisher-Yates Shuffle)
  for (let i = foodPool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [foodPool[i], foodPool[j]] = [foodPool[j], foodPool[i]];
  }
}

// 取得下一個出現的食材
function selectFoodType() {
  // 剩餘時間 5~15 秒間，有 15% 機率觸發龍蝦 (全場限 1 次)
  if (!lobsterSpawned && gameTime <= 15 && gameTime >= 5 && Math.random() < 0.15) {
    lobsterSpawned = true;
    return FOOD_TYPES.find(f => f.type === 'lobster');
  }

  if (foodPool.length === 0) {
    initFoodPool();
  }
  return foodPool.pop();
}
function updateTimer() {
    timeLeft--;
    if (timeLeft <= 0) {
        timeLeft = 0;
        endGame();
    }
}

function spawnFood() {
    if (!gameRunning || gameEnded) return;

    // 🔥 先決定要生成什麼食材
    let foodType = selectFoodType();
    if (!foodType) return;

    // 🔥 龍蝦控制（整場只出現 1 次）
    if (foodType.id === 'lobster') {
        if (lobsterSpawned) return;      // 已出現 → 不再出現
        lobsterSpawned = true;           // 標記為已出現
        // 龍蝦直接出現，不跳過
    }

    // 🔥 陷阱控制（有數量限制 + 冷卻）
    if (foodType.id === 'trap') {
        if (trapCount >= targetTrapCount) return;
        if (trapCooldownTimer > 0) return;
        trapCount++;
        trapCooldownTimer = 3;  // 3 秒冷卻
    }

    // 生成食材
    const x = Math.random() * (canvas.width - CONFIG.foodSize);
    const speed = CONFIG.fallSpeedMin + Math.random() * (CONFIG.fallSpeedMax - CONFIG.fallSpeedMin);

    foods.push({
        type: foodType,
        x: x,
        y: -CONFIG.foodSize,
        size: CONFIG.foodSize,
        speed: speed,
    });
}

function selectFoodType() {
    // 🔥 移除龍蝦邏輯，只處理陷阱冷卻
    
    let trapInCooldown = trapCooldownTimer > 0;
    
    let totalWeight = 0;
    for (let f of FOOD_TYPES) {
        if (f.id === 'trap' && (trapCount >= targetTrapCount || trapInCooldown)) continue;
        totalWeight += f.weight;
    }

    let rand = Math.random() * totalWeight;
    for (let f of FOOD_TYPES) {
        if (f.id === 'trap' && (trapCount >= targetTrapCount || trapInCooldown)) continue;
        rand -= f.weight;
        if (rand <= 0) return f;
    }
    return FOOD_TYPES[0];
}

function gameLoop() {
    if (!gameRunning) return;
    if (gameEnded) { draw(); return; }

    update();
    draw();
    animationId = requestAnimationFrame(gameLoop);
}

function update() {
    // 🔥 更新陷阱冷卻（放在 for 迴圈外面）
    if (trapCooldownTimer > 0) {
        trapCooldownTimer -= 1/60;
        if (trapCooldownTimer < 0) trapCooldownTimer = 0;
    }
    
    const potBottom = CONFIG.potY + CONFIG.potHeight;
    for (let i = foods.length - 1; i >= 0; i--) {
        const food = foods[i];
        food.y += food.speed;

        if (food.y + food.size > potBottom &&
            food.y + food.size < potBottom + 20 &&
            food.x + food.size > potX &&
            food.x < potX + CONFIG.potWidth) {

            const change = food.type.score;
            score += change;
            showFloatText(food.x + food.size/2, food.y, change, food.type.id === 'lobster');
            foods.splice(i, 1);
            continue;
        }

        if (food.y > canvas.height + 20) {
            foods.splice(i, 1);
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const bgImg = IMAGES['bg_img'];
    if (bgImg && bgImg.complete) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = '#2d1a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    for (let food of foods) {
        const imgKey = food.type.id + '_img';
        const img = IMAGES[imgKey];
        if (img && img.complete) {
            ctx.drawImage(img, food.x, food.y, food.size, food.size);
        } else {
            ctx.fillStyle = food.type.score > 0 ? '#4caf50' : '#ff4444';
            ctx.fillRect(food.x, food.y, food.size, food.size);
            ctx.fillStyle = '#fff';
            ctx.font = '22px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(food.type.emoji, food.x + food.size/2, food.y + food.size/2 + 8);
        }
    }

    const potImg = IMAGES['pot_img'];
    if (potImg && potImg.complete) {
        ctx.drawImage(potImg, potX, CONFIG.potY, CONFIG.potWidth, CONFIG.potHeight);
    } else {
        ctx.fillStyle = '#8B0000';
        ctx.fillRect(potX, CONFIG.potY, CONFIG.potWidth, CONFIG.potHeight);
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(potX + 4, CONFIG.potY - 4, CONFIG.potWidth - 8, 6);
    }

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(ctx, 10, 10, 150, 58, 12, true, false);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 17px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`🏆 ${score} 分`, 22, 37);
    ctx.fillStyle = '#ffd700';
    ctx.fillText(`⏱️ ${timeLeft}s`, 22, 60);

    for (let i = floatTexts.length - 1; i >= 0; i--) {
        const ft = floatTexts[i];
        ft.y -= 1.8;
        ft.life -= 0.025;
        if (ft.life <= 0) {
            ft.el.remove();
            floatTexts.splice(i, 1);
            continue;
        }
        ft.el.style.top = ft.y + 'px';
        ft.el.style.left = ft.x + 'px';
        ft.el.style.opacity = ft.life;
        ft.el.style.transform = `scale(${1 + (1 - ft.life) * 0.3})`;
    }
}

function roundRect(ctx, x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
}

// ==================== 浮動文字 ====================
function showFloatText(x, y, change, isSpecial) {
    const el = document.createElement('div');
    el.className = 'float-text';
    if (change > 0) el.classList.add('positive');
    else if (change < 0) el.classList.add('negative');
    if (isSpecial) el.classList.add('special');

    const sign = change > 0 ? '+' : '';
    el.textContent = sign + change;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const absX = (x / scaleX) + rect.left;
    const absY = (y / scaleY) + rect.top;

    el.style.left = absX + 'px';
    el.style.top = absY + 'px';
    document.body.appendChild(el);

    floatTexts.push({
        el: el,
        x: absX,
        y: absY,
        life: 1.0
    });
}

// ==================== 遊戲結束 ====================
function endGame() {
    if (gameEnded) return;
    gameEnded = true;
    gameRunning = false;

    if (timerInterval) clearInterval(timerInterval);
    if (spawnInterval) clearInterval(spawnInterval);
    if (animationId) cancelAnimationFrame(animationId);

    // 🔥 立即顯示結果畫面（避免空白等待）
    resultScreen.style.display = 'flex';
    
    // 🔥 顯示載入狀態
    document.getElementById('resultEmoji').textContent = '⏳';
    document.getElementById('resultTitle').textContent = '結算中...';
    document.getElementById('resultTitle').className = 'result-title';
    document.getElementById('resultScore').textContent = `得分：${score} 分`;
    document.getElementById('resultInfo').textContent = '請稍候...';
    document.getElementById('resultBonus').textContent = '';
    document.getElementById('resultStars').innerHTML = '';
    document.getElementById('replayBtn').style.display = 'none';

    isWin = score >= CONFIG.threshold;
    const cost = gameStatus && !gameStatus.freePlay ? CONFIG.costPerPlay : 0;

    // 🔥 呼叫 API 並更新結果
    submitResult(score, cost).then(data => {
        gameResultData = data;
        showResult(data);
    }).catch(() => {
        showResult({ success: false, message: '網路錯誤' });
    });
}

function showResult(data) {
    const emoji = document.getElementById('resultEmoji');
    const title = document.getElementById('resultTitle');
    const scoreEl = document.getElementById('resultScore');
    const infoEl = document.getElementById('resultInfo');
    const bonusEl = document.getElementById('resultBonus');
    const stars = document.getElementById('resultStars');
    const bg = document.getElementById('resultBg');

    const isWinLocal = isWin && data.success;
    const remaining = data.remaining || 0;

    // 清除舊的星星
    stars.innerHTML = '';

    if (isWinLocal) {
        emoji.textContent = '🎉';
        title.textContent = '太棒了！達標！';
        title.className = 'result-title win';
        scoreEl.textContent = `得分：${score} 分`;
        infoEl.textContent = '';
        bonusEl.textContent = `🎁 獲得 ${CONFIG.bonusPoints} 點！`;
        
        // 五星動畫
        for (let i = 0; i < 5; i++) {
            const span = document.createElement('span');
            span.className = 'star-icon';
            span.textContent = '⭐';
            stars.appendChild(span);
        }
        
        const bgImg = IMAGES['successBg_img'];
        if (bgImg && bgImg.complete) {
            bg.style.backgroundImage = `url(${IMAGES.successBg})`;
        }
        replayBtn.style.display = 'none';
        
    } else if (isWin && !data.success) {
        emoji.textContent = '⚠️';
        title.textContent = '達標但儲存失敗';
        title.className = 'result-title lose';
        scoreEl.textContent = `得分：${score} 分`;
        infoEl.textContent = data.message || '請聯絡客服';
        bonusEl.textContent = '';
        replayBtn.style.display = 'none';
        
    } else {
        emoji.textContent = '😅';
        title.textContent = '再接再厲！';
        title.className = 'result-title lose';
        scoreEl.textContent = `得分：${score} 分 / 目標：${CONFIG.threshold} 分`;
        infoEl.textContent = data.success ? `剩餘可用次數：${remaining}` : data.message || '';
        bonusEl.textContent = '💪 差一點就達標了！';

        const bgImg = IMAGES['failBg_img'];
        if (bgImg && bgImg.complete) {
            bg.style.backgroundImage = `url(${IMAGES.failBg})`;
        }

        if (data.success && remaining > 0 && CONFIG.costPerPlay > 0) {
            replayBtn.style.display = 'inline-block';
            replayBtn.textContent = `🔄 再玩一次（扣 ${CONFIG.costPerPlay} 點）`;
            replayBtn.disabled = false;
        } else {
            replayBtn.style.display = 'none';
        }
    }
}

// ==================== 再玩一次 ====================
let replayCallback = null;

function showConfirmReplay() {
    const cost = CONFIG.costPerPlay;
    confirmMessage.textContent = `是否花費 ${cost} 點再玩一次？\n（今日剩餘可用次數：${gameResultData?.remaining || 0}）`;
    confirmOverlay.style.display = 'flex';
}

function confirmReplay() {
    confirmOverlay.style.display = 'none';
    // 重新檢查遊戲狀態
    callApi('checkGameStatus', { userId: userId }).then(data => {
        gameStatus = data;
        if (data.available) {
            // 關閉結果畫面，回到開始畫面
            resultScreen.style.display = 'none';
            startScreen.style.display = 'flex';
            startBtn.disabled = false;
            let msg = data.freePlay ? '🎮 免費遊玩一次！' : '💎 花費 ' + data.cost + ' 點再玩一次！';
            showStatus('✅ ' + msg);
            // 🔥 重新讀取最新會員資料，更新點數顯示
            if (window.parent && window.parent.refreshMemberData) {
                window.parent.refreshMemberData();
            }
        } else {
            showStatus('⏳ ' + data.message);
            replayBtn.style.display = 'none';
        }
    }).catch(() => {
        showStatus('⚠️ 無法連線到伺服器');
    });
}

function cancelReplay() {
    confirmOverlay.style.display = 'none';
}

// ==================== 控制 ====================
function handleMove(e) {
    if (!gameRunning) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    potX = Math.max(0, Math.min(x - CONFIG.potWidth/2, canvas.width - CONFIG.potWidth));
}

function handleTouchMove(e) {
    e.preventDefault();
    if (!gameRunning) return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
    potX = Math.max(0, Math.min(x - CONFIG.potWidth/2, canvas.width - CONFIG.potWidth));
}

function handleTouchStart(e) {
    e.preventDefault();
    if (!gameRunning) return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
    potX = Math.max(0, Math.min(x - CONFIG.potWidth/2, canvas.width - CONFIG.potWidth));
}

// ==================== UI 輔助 ====================
function showStatus(msg) {
    playStatus.textContent = msg;
}

function goBack() {
    // 🔥 直接跳回會員頁面（使用 location.href）
    // 請把網址換成你的會員頁面實際網址
    var memberPageUrl = 'https://oldmapot.github.io/modeltest/index.html';
    
    // 帶上 userId，讓會員頁面自動登入
    if (userId) {
        memberPageUrl += '?userId=' + encodeURIComponent(userId);
    }
    
    window.location.href = memberPageUrl;
}

document.addEventListener('DOMContentLoaded', init);
