<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>老娘領地 - 夥伴登入</title>
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #8b0000 0%, #ab545a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 32px;
            padding: 12px 28px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        .logo-img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            display: inline-block;
        }
        h1 {
            font-size: 28px;
            color: #8b0000;
            margin-bottom: 4px;
            font-weight: 700;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 18px;
            border-bottom: 1px solid #eee;
            padding-bottom: 16px;
        }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 16px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }
        .input-group input:focus {
            outline: none;
            border-color: #8b0000;
            background: white;
            box-shadow: 0 0 0 3px rgba(139,0,0,0.1);
        }
        .login-btn {
            width: 100%;
            padding: 16px;
            background: #8b0000;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .error-message {
            background: #ffe5e5;
            color: #d00;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #999;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .demo-hint {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 16px;
            color: #666;
            text-align: left;
        }
        .demo-hint strong { color: #8b0000; }
        .footer-note {
            margin-top: 28px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <img src="https://i.postimg.cc/KvytPffF/wei-ming-ming-she-ji-(23).png" class="logo-img">
        </div>
        <h1>老娘領地</h1>
        <div class="subtitle">夥伴登入系統</div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>📱 登入帳號</label>
                <input type="text" id="userId" placeholder="請輸入帳號" required>
            </div>
            <div class="input-group">
                <label>🔑 登入密碼</label>
                <div class="password-wrapper">
                    <input type="password" id="keyword" placeholder="請輸入密碼" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                </div>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">登入系統</button>
        </form>
        
        <div id="errorMsg" class="error-message"></div>
        
        <div class="demo-hint">
            <strong>💡 登入說明：</strong><br>
            • 老娘夥伴限定登入<br>
            • 忘記密碼請聯絡管理員
        </div>
        <div class="footer-note">© 老娘領地 夥伴端</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vconsole@3.15.1/dist/vconsole.min.js"></script>
    <script>
        var vConsole = new VConsole();
        console.log("✅ vConsole 已啟動");

        // ============================================================
        //  🔥 設定區
        // ============================================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxlvZ-DzBBuZlqudFQF2RWTbVBD5GJwXdV0OYWxemjPaeq7aJxFN19kguOeOeGXLYM4uw/exec";
        const LIFF_ID = "2009625641-AYIKoXbw";
        let _lineUid = '';

        // ============================================================
        //  🔥 輔助函數
        // ============================================================
        function togglePassword() {
            const input = document.getElementById('keyword');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function hideError() {
            document.getElementById('errorMsg').style.display = 'none';
        }

        function getDeviceId() {
            let deviceId = localStorage.getItem('device_id');
            if (!deviceId) {
                const screenInfo = `${screen.width}x${screen.height}`;
                const timeStamp = Date.now();
                const randomStr = Math.random().toString(36).substring(2, 15);
                deviceId = btoa(`${screenInfo}_${timeStamp}_${randomStr}`).substring(0, 32);
                localStorage.setItem('device_id', deviceId);
            }
            return deviceId;
        }

        function getDeviceName() {
            const ua = navigator.userAgent;
            if (ua.indexOf('iPhone') > -1) return 'iPhone';
            if (ua.indexOf('iPad') > -1) return 'iPad';
            if (ua.indexOf('Android') > -1) return 'Android Phone';
            return 'Unknown Device';
        }

        // ============================================================
        //  🔥 預熱機制（Ping GAS）
        // ============================================================
        function warmUpGAS() {
            console.log("🔥 背景預熱 GAS（Ping）...");
            
            fetch(`${GAS_URL}?action=ping&t=${Date.now()}`, {
                method: 'GET',
                mode: 'no-cors'
            })
            .then(() => {
                console.log("✅ GAS 預熱完成（背景）");
            })
            .catch(() => {
                // 預熱失敗不影響主流程
                console.log("⚠️ GAS 預熱失敗（背景），不影響登入");
            });
        }

        // ============================================================
        //  🔥 登入請求（含自動重試 1 次）
        // ============================================================
        async function loginWithRetry(verifyUrl) {
            let lastError = null;
            
            // 最多嘗試 2 次（第 1 次 + 1 次重試）
            for (let attempt = 1; attempt <= 2; attempt++) {
                try {
                    console.log(`📤 登入嘗試 ${attempt}/2`);
                    
                    const response = await fetch(verifyUrl, {
                        method: 'GET',
                        redirect: 'follow'
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const result = await response.json();
                    console.log(`✅ 登入嘗試 ${attempt} 成功`);
                    return result;
                    
                } catch (error) {
                    lastError = error;
                    console.warn(`⚠️ 登入嘗試 ${attempt} 失敗:`, error.message);
                    
                    // 如果是第一次失敗，重試 1 次（等待 1 秒）
                    if (attempt === 1) {
                        console.log("⏳ 1 秒後重試...");
                        await new Promise(resolve => setTimeout(resolve, 1000));
                    }
                }
            }
            
            // 兩次都失敗
            throw lastError || new Error('所有登入嘗試皆失敗');
        }

        // ============================================================
        //  🔥 核心登入函數
        // ============================================================
        async function handleLogin(event) {
            event.preventDefault();
            
            const userId = document.getElementById('userId').value.trim();
            const keyword = document.getElementById('keyword').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            
            if (!userId || !keyword) {
                showError('請輸入完整的帳號和密碼');
                return;
            }
            
            // 🔥 隱藏舊錯誤
            hideError();
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> 驗證中...';
            
            try {
                // 取得 IP
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                const clientIp = ipData.ip;

                const deviceId = getDeviceId();
                const deviceName = getDeviceName();
                const lineUid = _lineUid || '';

                // 組裝登入 URL
                const verifyUrl = `${GAS_URL}?action=staffLogin&userId=${encodeURIComponent(userId)}&keyword=${encodeURIComponent(keyword)}&lineUid=${encodeURIComponent(lineUid)}&deviceId=${encodeURIComponent(deviceId)}&deviceName=${encodeURIComponent(deviceName)}&clientIp=${encodeURIComponent(clientIp)}&skipLog=true&t=${Date.now()}`;
                
                console.log("📌 登入請求 URL:", verifyUrl);
                
                // 🔥 使用含重試機制的登入函數
                const result = await loginWithRetry(verifyUrl);
                
                console.log("📌 後端回傳:", JSON.stringify(result));
                
                if (result.success) {
                    // 🔥 存入 localStorage 備份
                    const staffData = {
                        name: result.name,
                        role: result.role || "夥伴",
                        loginId: result.loginId || userId,
                        branch: result.branch || '老娘鍋河堤店',
                        clientIp: clientIp,
                        lineUid: lineUid
                    };
                    localStorage.setItem('staffData', JSON.stringify(staffData));
                    console.log("✅ 登入資料已存入 localStorage");
                    
                    // 跳轉到 staff.html
                    const targetUrl = `staff.html?name=${encodeURIComponent(result.name)}&branch=${encodeURIComponent('老娘鍋河堤店')}&loginId=${encodeURIComponent(result.loginId || userId)}&role=${encodeURIComponent(result.role || '')}`;
                    window.location.href = targetUrl;
                } else {
                    showError(result.message || '帳號或密碼錯誤，請重新輸入');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '登入系統';
                }
                
            } catch (error) {
                console.error('登入失敗:', error);
                showError('⚠️ 系統連線異常，請稍後再試');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '登入系統';
            }
        }

        // ============================================================
        //  🔥 點擊輸入框時觸發預熱（加上頁面載入預熱）
        // ============================================================
        function setupWarmUp() {
            // 1. 頁面載入時預熱
            warmUpGAS();
            
            // 2. 點擊輸入框時再次預熱（確保 GAS 已喚醒）
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    console.log("📱 輸入框聚焦，再次預熱 GAS");
                    warmUpGAS();
                });
            });
        }

        // ============================================================
        //  🔥 initLiff
        // ============================================================
        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isInClient()) {
                    showError('📱 僅支援手機 LINE App 開啟使用');
                    return;
                }
                
                const isMobile = /mobile|android|iphone|ipad|ipod/i.test(navigator.userAgent.toLowerCase());
                if (!isMobile) {
                    showError('📱 僅支援手機 LINE App 開啟使用');
                    return;
                }
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                
                const profile = await liff.getProfile();
                _lineUid = profile.userId;
                console.log("✅ LINE UID 取得成功:", _lineUid);
                
            } catch(e) {
                console.error('LIFF 初始化失敗:', e);
                showError('初始化失敗，請在 LINE App 中開啟');
            }
        }

        // ============================================================
        //  ✅ 啟動
        // ============================================================
        // 頁面載入完成後，設定預熱 + 啟動 LIFF
        document.addEventListener('DOMContentLoaded', function() {
            setupWarmUp();
            initLiff();
        });
    </script>
</body>
</html>
