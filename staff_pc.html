<!DOCTYPE html>  
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>老娘領地 - 電腦版</title>
   <style>
/* ===== 全域設定 ===== */
    body { 
        font-family: "Microsoft JhengHei", sans-serif; 
        padding: 15px; 
        background: #f4f7f6; 
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
    }
     
    /* ===== 卡片容器 ===== */
    .card {
        background: white;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        width: 100%;
        max-width: 1050px; 
        max-height: 95vh;
        overflow-y: auto;
        box-sizing: border-box;
        margin: auto;
    }

    /* ===== 頂部橫向配置 (對應配置_2.jpg上方) ===== */
    .top-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #ddd;
        padding-bottom: 12px;
        margin-bottom: 20px;
        gap: 15px;
    }

    .shop-brand-area {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .role-badge { 
        background: #333; 
        color: white; 
        padding: 2px 8px; 
        border-radius: 4px; 
        font-size: 12px; 
        display: inline-block;
        width: fit-content;
    }

    /* ===== 左右雙欄主網格 ===== */
    .card-layout {
        display: grid;
        grid-template-columns: 1fr 1.35fr; 
        gap: 20px;
        align-items: start;
    }

    .column-left, .column-right {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    /* ===== 右側表單內的 2x2 雙欄輸入區 ===== */
    .inputs-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    /* ===== 按鈕通用 ===== */
    .btn { 
        padding: 12px; 
        border: none; 
        border-radius: 8px; 
        font-size: 16px; 
        font-weight: bold; 
        cursor: pointer; 
        transition: all 0.3s ease;
    }
     
    .btn-submit { 
        background: #1a73e8; 
        color: white; 
        width: 100%;
        margin-top: 5px; 
    }
     
    .btn-submit:hover:not(:disabled) { background: #1557b0; }
    .btn-submit:disabled { background: #ccc; cursor: not-allowed; }

    .header-btn { 
        font-size: 12px; 
        padding: 5px 10px; 
        border: none; 
        border-radius: 4px; 
        cursor: pointer; 
        font-weight: bold;
    }
     
    /* ===== 表單與欄位 ===== */
    .input-group { 
        margin-bottom: 0; 
    }
     
    label { 
        display: block; 
        margin-bottom: 4px; 
        font-weight: bold; 
        font-size: 13px; 
    }
     
    input { 
        width: 100%; 
        padding: 9px 12px; 
        border: 1px solid #ddd; 
        border-radius: 8px; 
        font-size: 14px; 
        box-sizing: border-box; 
    }
     
    input:focus {
        border-color: #1a73e8;
        outline: none;
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
    }
     
    .locked { opacity: 0.4; pointer-events: none; }
     
    /* ===== 會員與資訊區塊 ===== */
    .member-info { 
        background: #fff9c4; 
        padding: 14px; 
        border-radius: 10px; 
        border: 1px solid #fbc02d;
        display: none; 
        font-size: 15px;
        line-height: 1.6;
    }
     
    .member-level { 
        display: inline-block; 
        background: #ff9800; 
        color: white; 
        padding: 2px 8px; 
        border-radius: 20px; 
        font-size: 12px; 
        margin-left: 8px; 
    }
     
    .info-box { 
        background: #e8f0fe; 
        padding: 12px 15px; 
        border-radius: 10px; 
        font-size: 14px; 
    }
     
    .redeem-tip {
        margin-top: 4px;
        padding: 5px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: bold;
    }
     
    .redeem-tip.tip-normal { background-color: #e3f2fd; color: #0d47a1; }
    .redeem-tip.tip-no-redeem { background-color: #ffebee; color: #b71c1c; }
    .redeem-tip.tip-ticket-mode { background-color: #f3e5f5; color: #4a148c; }

    /* ===== 彈跳訊息視窗 (置中懸浮，平時隱藏) ===== */
    #customModal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.6);
        z-index: 99999;
        justify-content: center;
        align-items: center;
    }
    .modal-content {
        background: #fff;
        padding: 24px;
        border-radius: 12px;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        text-align: center;
    }
    .modal-btn {
        margin-top: 16px;
        padding: 8px 20px;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .modal-btn:hover { background: #1557b0; }

    /* ===== 執行中的轉圈圈遮罩 (置中懸浮，平時隱藏) ===== */
    #loadingOverlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.5);
        z-index: 99999;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 12px;
    }
    .loading-spinner {
        width: 45px;
        height: 45px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #1a73e8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    .loading-text {
        color: white;
        font-size: 16px;
        font-weight: bold;
        background: rgba(0, 0, 0, 0.7);
        padding: 6px 16px;
        border-radius: 20px;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    /* ===== 手機響應式 ===== */
    @media (max-width: 768px) {
        body { padding: 8px; }
        .card { padding: 15px; max-height: none; }
        .card-layout, .top-header-bar, . { grid-template-columns: 1fr; }
        .top-header-bar { flex-direction: column; align-items: stretch; }
    }
</style>
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>

<div id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">老娘正在火速趕來...</div>
</div>

<div id="customModal">
    <div class="modal-content">
        <div id="modalText" style="line-height: 1.6; text-align: left; font-size: 16px;"></div>
        <button class="modal-btn" onclick="closeModal()">我了解了</button>
    </div>
</div>

<!-- ============================================================
     🔒 鎖屏遮罩（電腦版）
     ============================================================ -->
<div id="lockScreen" style="
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85);
    z-index: 99999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 30px 20px;
">
    <div style="
        background: #fff;
        border-radius: 16px;
        padding: 30px 24px;
        max-width: 300px;
        width: 100%;
        text-align: center;
    ">
        <div style="font-size: 48px; margin-bottom: 8px;">🔒</div>
        <h3 style="color: #333; margin-bottom: 4px;">畫面已鎖定</h3>
        <p style="color: #999; font-size: 14px; margin-bottom: 16px;">請選擇帳號並輸入密碼解鎖</p>
        
        <!-- 帳號下拉選單 -->
        <select id="lockStaffSelect" style="
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 12px;
        ">
            <option value="">-- 請選擇帳號 --</option>
        </select>
        
        <!-- 密碼輸入 + 錯誤訊息 -->
        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px;">

            ">
            <div id="lockPasswordError" style="
                display: none; color: #ff4444; font-size: 13px; font-weight: 600; white-space: nowrap;
                background: #fff0f0; padding: 6px 10px; border-radius: 6px; border: 1px solid #ff4444;
            ">
                ❌ 錯誤
            </div>
        </div>
        
        <button onclick="unlockSession()" style="
            width: 100%; padding: 14px; background: #00b900; color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer;
        ">🔓 解鎖</button>
        
        <button onclick="forceLogout()" style="
            width: 100%; padding: 12px; background: #ff4444; color: white; border: none; border-radius: 8px;
            font-size: 14px; cursor: pointer; margin-top: 8px;
        ">🚪 登出</button>
    </div>
</div>

<div id="mainUI" class="card">
    <!-- 🌟 頂部橫向配置 -->
    <div class="top-header-bar">
        <div class="shop-brand-area">
            <h2 style="margin:0;"><span id="shop-name">老娘鍋河堤店</span></h2>
            <div><span id="role-text" class="role-badge">bigBoss</span>：<span id="staff-name">小可</span></div>
        </div>

        <!-- 📷 掃描狀態列置於頂部中間 -->
        <div id="scanStatusBar" style="background: #f8f9fa; border-radius: 8px; border: 1px solid #ccc; padding: 6px 12px; flex-grow: 1; max-width: 380px;">
            <div style="display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 14px;">📷</span>
                <span id="scanStatusDot" style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #28a745;"></span>
                <span id="scanStatusText" style="font-size: 12px; color: #28a745; font-weight: 500;">就緒</span>
                <div id="scanErrorMessage" style="display: none; margin-left: auto; font-size: 11px; color: #cc0000;">
                    ❌ <span id="scanErrorText">錯誤</span>
                </div>
            </div>
            <div style="font-size: 10px; color: #888; margin-top: 2px;">💡 請將 QR Code 對準掃碼槍，系統會自動偵測</div>
        </div>

        <!-- 右上角功能按鈕 -->
        <div style="display: flex; flex-direction: column; gap: 5px; align-items: flex-end;">
            <div style="display: flex; gap: 5px;">
                <button class="header-btn" onclick="showSwitchAccount()" style="background:#ff9800; color:#fff;">🔄 切換帳號</button>
                <button class="header-btn" onclick="logout()" style="background:#ff4444; color:#fff;">登出</button>
            </div>
            <button class="header-btn" onclick="forceReset()" style="background:#666; color:#fff; width:100%;">🔄 重新整理</button>
        </div>
    </div>

    <!-- 🌟 左右雙欄主體內容 -->
    <div class="card-layout">
        
        <!-- 【左欄】：會員資訊、優惠券資訊 (補回!) -->
        <div class="column-left">
            <!-- 👤 會員資訊 -->
            <div class="member-info" id="member-ui">
                顧客：<b id="cus-name">-</b> <span id="member-level" class="member-level"></span><br>
                現有資產：<b id="cus-pts" style="color:red;">0</b> 點<br>
                累積消費：<b id="cus-total">0</b> 元
            </div>
            
            <!-- 🎫 優惠券資訊 -->
            <div id="coupon-info" style="display:none; background:#fff3e0; border:2px solid #ff9800; border-radius:10px; padding:12px 15px;">
                <div style="font-weight:bold; color:#e65100; font-size:15px;">
                    🎫 使用優惠券：<span id="coupon-name-display">載入中...</span>
                </div>
                <div style="font-size:13px; color:#555; margin-top:2px;">
                    <span id="coupon-content-display">優惠資料讀取中...</span>
                </div>
                <div style="font-size:13px; color:#666; margin-top:4px;">
                    滿 <span id="coupon-min-spend-display">--</span> 元 <span id="coupon-action-label">贈</span> <span id="coupon-action-value-display">--</span> <span id="coupon-action-unit">點</span>
                </div>
                <div id="coupon-status-display" style="font-size:12px; margin-top:6px; font-weight:bold;">
                    請輸入消費金額以確認門檻
                </div>
                <div id="coupon-rule-note" style="font-size:11px; color:#999; margin-top:2px;">
                    ⚠️ 未達門檻時，優惠券將保留，下次使用

            </div>
        </div>

        <!-- 【右欄】：模式勾選、2x2 輸入框、結算與按鈕 -->
        <div class="column-right">
            <div id="form-ui" class="locked">
                <label style="background:#fff3e0; padding:8px 12px; display:block; border-radius:8px; margin-bottom:12px; cursor:pointer; border:1px solid #ff9800; font-size: 13px;">
                    <input type="checkbox" id="ticketMode" onchange="toggleMode()" style="width:auto;"> <b>勾選：購買餐券模式 (無股東分紅)</b>
                </label>

                <!-- 2x2 左右並排輸入區 -->
                <div class="inputs-grid" id="normal-fields">
                    <div class="input-group">
                        <label>1. 本日消費總額</label>
                        <input type="text" id="totalSpend" inputmode="decimal" oninput="doCalc()" placeholder="輸入消費金額">
                    </div>
                    <div class="input-group">
                        <label>3. 使用餐券金額</label>
                        <input type="text" id="ticketSpend" inputmode="decimal" oninput="doCalc()" placeholder="輸入餐券支付額">
                    </div>
                    <div class="input-group">
                        <label>2. 活動折抵消費</label>
                        <input type="text" id="couponDiscount" inputmode="decimal" oninput="doCalc()" placeholder="0" readonly style="background:#f5f5f5;cursor:not-allowed;">
                    </div>
                    <div class="input-group">
                        <label>4. 折抵點數 (上限：<span id="max-hint" style="color:blue;">0</span>)</label>
                        <input type="text" id="redeemAmount" inputmode="numeric" oninput="doCalc()" placeholder="欲折抵點數">
                        <div id="redeemTip" class="redeem-tip tip-normal"></div>
                    </div>
                </div>

                <div class="info-box" style="margin-top: 12px;">
                    <div id="pointsDisplay">
                        本次預計發放點數：<b id="new-pts" style="color:#1a73e8;">0</b> 點
                        <span id="bonus-points-display" style="display:none;color:#ff6b00;"></span>
                    </div>
                    <div style="margin-top:4px;">
                        結帳後總資產：<b id="after-pts">0</b> 點
                    </div>
                </div>

                <button class="btn btn-submit" id="submitBtn" onclick="submitData()" style="margin-top: 12px;">確認過卡</button>
            </div>
        </div>

    </div>
</div>
<script>
    // ============================================================
    //  GAS URL
    // ============================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxlvZ-DzBBuZlqudFQF2RWTbVBD5GJwXdV0OYWxemjPaeq7aJxFN19kguOeOeGXLYM4uw/exec";

    // ============================================================
    //  全域變數
    // ============================================================
    let staff = { name: "", branch: "", role: "夥伴", loginId: "", deviceId: "" };
    let isLoggedIn = false;
    let isStaffVerified = false;
    let config = { minSpend: 0, maxRate: 0, earnRate: 0, ticketRate: 0, shopCode: "", eventMultiplier: 1 };
    let customerId = "", currentPoints = 0, memberLevel = "", levelRate = 1;
    let cachedPrefixes = null;
    let scanMode = 'member';
    let currentMemberData = null;
    let isScreenLocked = false;
    let cachedSwitchableStaff = null;
    let isProcessing = false;  // 🔥 新增：標記是否正在處理掃描
    // 閒置計時器
    let idleTimer = null;
    let idleTimeout = 5 * 60 * 1000; // 5 分鐘（毫秒）
    let isLocked = false;  // 🔥 鎖定標記

// ============================================================
//  掃碼槍監聽（不搶焦點版）
// ============================================================

let scanBuffer = '';
let scanTimer = null;

document.addEventListener('keydown', function(e) {
    // 如果按的是 Enter，檢查緩衝區
    if (e.key === 'Enter') {
        if (scanBuffer.length > 5) {
            // 掃描完成
            console.log('📌 掃描輸入:', scanBuffer);
            var val = scanBuffer.trim();
            scanBuffer = '';
            onScanSuccess(val);
        }
        return;
    }
    
    // 只處理可列印字元（掃碼槍輸入）
    if (e.key.length === 1 && e.key.match(/[\w\d\-_=+]/)) {
        // 如果焦點在金額輸入框，不攔截
        var active = document.activeElement;
        if (active && active.tagName === 'INPUT') {
            var id = active.id;
            if (id === 'totalSpend' || id === 'ticketSpend' || id === 'redeemAmount' || id === 'couponDiscount') {
                return; // 讓金額輸入框正常輸入
            }
        }
        
        // 收集掃碼槍輸入
        scanBuffer += e.key;
        clearTimeout(scanTimer);
        scanTimer = setTimeout(function() {
            scanBuffer = '';
        }, 100);
    }
});
// ============================================================
//  掃描狀態輔助函數
// ============================================================

function showScanError(message) {
    scanErrorText.textContent = message;
    scanErrorMessage.style.display = 'block';
    scanStatusDot.style.background = '#dc3545';
    scanStatusText.textContent = '錯誤';
    scanStatusText.style.color = '#dc3545';
    clearTimeout(window.scanErrorTimer);
    window.scanErrorTimer = setTimeout(function() {
        hideScanError();
    }, 3000);
}

function hideScanError() {
    scanErrorMessage.style.display = 'none';
    scanStatusDot.style.background = '#28a745';
    scanStatusText.textContent = '就緒';
    scanStatusText.style.color = '#28a745';
}

function showScanning() {
    scanStatusDot.style.background = '#ffc107';
    scanStatusText.textContent = '掃描中...';
    scanStatusText.style.color = '#ffc107';
}
    // ============================================================
    //  工具函數
    // ============================================================
    function getDeviceId() {
        let deviceId = localStorage.getItem('pc_device_id');
        if (!deviceId) {
            const screenInfo = `${screen.width}x${screen.height}`;
            const userAgent = navigator.userAgent;
            const timeStamp = Date.now();
            const randomStr = Math.random().toString(36).substring(2, 15);
            deviceId = btoa(`${screenInfo}_${userAgent}_${timeStamp}_${randomStr}`).substring(0, 32);
            localStorage.setItem('pc_device_id', deviceId);
            console.log("📌 產生新的電腦設備 ID:", deviceId);
        } else {
            console.log("📌 讀取已存在的電腦設備 ID:", deviceId);
        }
        return deviceId;
    }

    function getUrlParam(name) {
        const url = new URLSearchParams(window.location.search);
        return url.get(name);
    }

    async function getUserIP() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            return data.ip;
        } catch (err) {
            console.warn("取得 IP 失敗，使用空值", err);
            return "";
        }
    }

    function safeJsonParse(text) {
        try {
            return JSON.parse(text);
        } catch (e) {
            console.error('❌ JSON 解析失敗，原始內容:', text);
            return null;
        }
    }

    function safeDecodeURIComponent(str) {
        try {
            return decodeURIComponent(str);
        } catch (e) {
            console.warn('⚠️ decodeURIComponent 失敗:', str);
            return str;
        }
    }

    // ============================================================
    //  UI 輔助函數
    // ============================================================
    function showLoading(text) { 
        const el = document.getElementById('loadingText'); 
        if (text) el.innerText = text; 
        document.getElementById('loadingOverlay').style.display = 'flex'; 
    }
    
    function hideLoading() { 
        document.getElementById('loadingOverlay').style.display = 'none'; 
    }
    
    function showModal(html) { 
        document.getElementById('modalText').innerHTML = html; 
        document.getElementById('customModal').style.display = 'flex'; 
    }
    
    function closeModal() { 
        document.getElementById('customModal').style.display = 'none'; 
    }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.innerText = msg;
        toast.style.cssText = 'position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:white; padding:10px 20px; border-radius:30px; z-index:30000; font-size:14px;';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    // ============================================================
    //  鎖屏與切換帳號
    // ============================================================
    function lockScreen() {
        if (!isLoggedIn) return;
        console.log('🔒 開啟切換帳號畫面');
        isScreenLocked = true;
        populateLockStaffListInstant();
        document.getElementById('lockPassword').value = '';
        document.getElementById('lockScreen').style.display = 'flex';
    }

    function showSwitchAccount() {
        if (!isLoggedIn) {
            showToast('⚠️ 請先登入');
            return;
        }
        populateLockStaffListInstant();
        document.getElementById('lockPassword').value = '';
        document.getElementById('lockScreen').style.display = 'flex';
        console.log('🔄 切換帳號介面已開啟');
    }
// ============================================================
//  閒置計時器
// ============================================================

function resetIdleTimer() {
    console.log('🔄 重置閒置計時器');  // ← 加這行
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function() {

    async function unlockSession() {
        const staffId = document.getElementById('lockStaffSelect').value;
        const password = document.getElementById('lockPassword').value;
        const errorEl = document.getElementById('lockPasswordError');
        const inputEl = document.getElementById('lockPassword');
        
        errorEl.style.display = 'none';
        inputEl.style.borderColor = '';
        inputEl.style.backgroundColor = '';
        
        if (!staffId) {
            errorEl.textContent = '⚠️ 選帳號';
            errorEl.style.display = 'block';
            inputEl.style.borderColor = '#ff4444';
            inputEl.style.backgroundColor = '#fff5f5';
            return;
        }
        
        if (!password) {
            errorEl.textContent = '⚠️ 輸密碼';
            errorEl.style.display = 'block';
            inputEl.style.borderColor = '#ff4444';
            inputEl.style.backgroundColor = '#fff5f5';
            inputEl.focus();
            return;
        }
        
        try {
            const result = await verifyStaffPassword(staffId, password);
            
            if (result.success) {
                const staffList = await getSwitchableStaff();
                const selectedStaff = staffList.find(s => s.id === staffId || s.loginId === staffId);
                if (!selectedStaff) {
                    throw new Error('找不到該店員資料');
                }
                staff.name = selectedStaff.name || '';
                staff.branch = selectedStaff.branch || staff.branch;
                staff.role = selectedStaff.role || '夥伴';
                staff.loginId = selectedStaff.loginId || selectedStaff.id;
                isLoggedIn = true;
                localStorage.setItem('staffLoginId', staff.loginId);
                localStorage.setItem('staffName', staff.name);
                localStorage.setItem('staffRole', staff.role);
                localStorage.setItem('staffBranch', staff.branch);
                document.getElementById('staff-name').innerText = staff.name;
                document.getElementById('role-text').innerText = staff.role;
                document.getElementById('shop-name').innerText = staff.branch || '老娘領地';
                const submitBtn = document.getElementById('submitBtn');
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '確認過卡';
                }
                errorEl.style.display = 'none';
                inputEl.style.borderColor = '';
                inputEl.style.backgroundColor = '';
                document.getElementById('lockScreen').style.display = 'none';
                // 🔥 清除鎖定標記
                localStorage.removeItem('isLocked');
                isLocked = false;

                resetIdleTimer();
                showToast('✅ 切換成功');
            } else {
                errorEl.textContent = '❌ 密碼錯誤';
                errorEl.style.display = 'block';
                inputEl.value = '';
                inputEl.style.borderColor = '#ff4444';
                inputEl.style.backgroundColor = '#fff5f5';
                inputEl.focus();
            }
        } catch (error) {
            errorEl.textContent = '⚠️ ' + error.message;
            errorEl.style.display = 'block';
            console.error('❌ unlockSession 錯誤:', error);
        }
    }

    //  核心函數：parseScannedCode
    // ============================================================
    function parseScannedCode(scannedText) {
        let clean = String(scannedText).trim();
        console.log("🔍 parseScannedCode 收到:", clean);
        if (clean.indexOf("data=") > -1) {
            clean = clean.split("data=")[1].split("&")[0];
            clean = safeDecodeURIComponent(clean);
        }
        if (clean.indexOf("##") === 0) clean = clean.substring(2);
        var parts = clean.split("_");
        console.log("📌 拆解結果:", parts);
        console.log("📌 parts 長度:", parts.length);
        if (parts.length === 3) {
            var shopCode = parts[0];
            var shopKey = parts[1];
            var userId = parts[2];
            if (shopCode === "OMP" || shopCode === "") {
                console.log("✅ 識別為【會員 QR】，memberId:", userId);
                return { type: "member", userId: userId, shopCode: shopCode, shopKey: shopKey };
            }
        }
        if (parts.length === 4) {
            var brandCode = parts[1];
            var couponId = parts[2];
            var userId = parts[3];
            if (brandCode === "OMP" || brandCode === "") {
                console.log("✅ 識別為【優惠券 QR】");
                console.log("   brandCode:", brandCode);
                console.log("   couponId:", couponId);
                console.log("   memberId (userId):", userId);
                return { type: "coupon", userId: userId, couponId: couponId, fullData: clean };
            }
        }
        console.warn("⚠️ 無法識別的 QR Code:", clean);
        return { type: "unknown", userId: clean };
    }

function doCalc() {
    let couponDiscountAmount = 0;
    let finalCouponBonus = 0;
    
    // ---------- 1. 獲取所有 DOM 元素（統一管理） ----------
    const elements = {
        totalInput: document.getElementById('totalSpend'),
        ticketInput: document.getElementById('ticketSpend'),
        redeemInput: document.getElementById('redeemAmount'),
        couponDiscountInput: document.getElementById('couponDiscount'),
        buyTicketInput: document.getElementById('buyTicket'),
        ticketModeCheck: document.getElementById('ticketMode'),
        tipEl: document.getElementById('redeemTip'),
        maxHintEl: document.getElementById('max-hint'),
        newPtsEl: document.getElementById('new-pts'),
        afterPtsEl: document.getElementById('after-pts'),
        couponBonusDisplay: document.getElementById('coupon-bonus-display'),
        bonusPointsDisplay: document.getElementById('bonus-points-display'),
        couponStatusDisplay: document.getElementById('coupon-status-display')
    };
    
    // ---------- 2. 檢查必要元素是否存在 ----------
    if (!elements.totalInput || !elements.ticketInput || !elements.redeemInput) {
        console.warn('⚠️ 必要表單元素不存在，跳過計算');
        return;
    }
    
    // ---------- 3. 取得當前數值 ----------
    const isTicketMode = elements.ticketModeCheck ? elements.ticketModeCheck.checked : false;
    const totalSpend = parseFloat(elements.totalInput.value) || 0;
    const ticketSpend = parseFloat(elements.ticketInput.value) || 0;
    const couponDiscount = parseFloat(elements.couponDiscountInput?.value) || 0;
    const redeemAmount = parseFloat(elements.redeemInput.value) || 0;
    const buyTicketAmount = parseFloat(elements.buyTicketInput?.value) || 0;
    
    // ---------- 4. 取得優惠券資訊（從全域變數） ----------
    const couponBonus = window.activeCoupon?.bonusPoints || 0;
    const couponMinSpend = window.activeCoupon?.minSpend || 0;
    const couponType = window.activeCoupon?.type || '';
    const couponName = window.activeCoupon?.couponName || '';
    const couponDiscountOriginal = window.activeCoupon?.discountAmount || 0;
    
    // ---------- 5. 取得系統配置 ----------
    const cfg = config || {};
    const earnRate = cfg.earnRate || 0.03;
    const levelRate = cfg.levelRate || 1;
    const eventMultiplier = cfg.eventMultiplier || 1;
    const maxRate = cfg.maxRate || 0;
    const shopCode = cfg.shopCode || 'OMP';
    
    // ---------- 6. 計算實際消費金額 ----------
    let baseAmount = totalSpend - ticketSpend - couponDiscount;
    
    // ============================================================
    //  🔥🔥🔥 優惠券折抵金額門檻歸零邏輯
    // ============================================================
    if (couponType === '消費折抵' && elements.couponDiscountInput) {
        const actualSpend = totalSpend - ticketSpend;
        const hasValidCoupon = window.activeCouponDocId && window.activeCouponDocId !== '';
        
        if (hasValidCoupon && couponMinSpend > 0) {
            if (actualSpend >= couponMinSpend) {
                if (elements.couponDiscountInput.value != couponDiscountOriginal) {
                    elements.couponDiscountInput.value = couponDiscountOriginal;
                    console.log('✅ 達門檻！折抵金額恢復為:', couponDiscountOriginal);
                }
            } else {
                if (elements.couponDiscountInput.value != 0) {
                    elements.couponDiscountInput.value = 0;
                    console.log('❌ 未達門檻（需滿', couponMinSpend, '，實際', actualSpend, '），折抵歸零');
                }
            }
        }
    }
    
    const finalCouponDiscount = parseFloat(elements.couponDiscountInput?.value) || 0;
    baseAmount = totalSpend - ticketSpend - finalCouponDiscount;
    
    // ---------- 7. 宣告結果變數 ----------
    let redeem = 0;
    let maxRedeem = 0;
    let basePoints = 0;
    let totalNewPoints = 0;
    let tipMessage = '';
    let tipClass = 'redeem-tip tip-normal';
    
    // ============================================================
    //  🔥 8. 優惠券門檻即時比對（顯示在 UI）
    // ============================================================
    if (elements.couponStatusDisplay && couponMinSpend > 0) {
        if (couponType) {
            const actualSpend = totalSpend - ticketSpend;
            
            if (actualSpend >= couponMinSpend) {
                elements.couponStatusDisplay.innerHTML = 
                    `✅ 已達門檻！消費滿 ${couponMinSpend} 元，可正常使用「${couponName || '優惠券'}」`;
                elements.couponStatusDisplay.style.color = '#2e7d32';
                elements.couponStatusDisplay.className = 'coupon-status eligible';
            } else {
                const diff = couponMinSpend - actualSpend;
                elements.couponStatusDisplay.innerHTML = 
                    `⚠️ 尚未達門檻（還差 ${diff} 元），優惠券將保留，下次使用`;
                elements.couponStatusDisplay.style.color = '#e65100';
                elements.couponStatusDisplay.className = 'coupon-status not-eligible';
            }
        } else {
            elements.couponStatusDisplay.innerHTML = '📋 尚未使用優惠券';
            elements.couponStatusDisplay.style.color = '#666';
            elements.couponStatusDisplay.className = 'coupon-status no-coupon';
        }
    }
    
    // ============================================================
    //  🔥 9. 點數計算邏輯
    // ============================================================
    if (isTicketMode) {
        basePoints = Math.floor(buyTicketAmount * earnRate * levelRate * eventMultiplier);
        totalNewPoints = basePoints + couponBonus;
        tipMessage = '🍽️ 餐券模式：僅計算餐券購買點數';
        tipClass = 'redeem-tip tip-ticket-mode';
        maxRedeem = 0;
        redeem = 0;
        console.log(`🍽️ 餐券模式: 購買 ${buyTicketAmount} 元 → ${basePoints} 點 + 活動贈點 ${couponBonus} 點`);
    } else {
        // ===== 一般消費模式 =====
        const baseForRedeem = totalSpend - ticketSpend - couponDiscount;
        const minSpendThreshold = shopCode === 'SWO' ? 500 : 1500;
        
        if (maxRate <= 0) {
            maxRedeem = 0;
            tipMessage = '🚫 今日活動暫停折抵';
            tipClass = 'redeem-tip tip-no-redeem';
        } else if (baseForRedeem < minSpendThreshold) {
            maxRedeem = 0;
            tipMessage = `⚠️ 未達低消門檻 ${minSpendThreshold} 元，無法折抵點數`;
            tipClass = 'redeem-tip tip-no-redeem';
        } else {
            maxRedeem = Math.min(
                currentPoints || 0,
                Math.floor(baseForRedeem * maxRate)
            );
            tipMessage = `✅ 已達低消 ${minSpendThreshold} 元，可折抵 ${maxRedeem} 點`;
            tipClass = 'redeem-tip tip-normal';
        }
        
        redeem = Math.min(redeemAmount, maxRedeem);
        
        // 🔥 優惠券折抵判斷（總額 - 餐券 - 點數折抵）
        const baseForCoupon = totalSpend - ticketSpend - redeem;
       
        
        if (couponType === '消費折抵' && couponMinSpend > 0) {
            if (baseForCoupon >= couponMinSpend) {
                couponDiscountAmount = couponDiscount;
                console.log(`✅ 折抵券達標！${baseForCoupon} 元 ≥ ${couponMinSpend} 元，折抵 ${couponDiscount} 元`);
            } else {
                console.log(`❌ 折抵券未達標（${baseForCoupon} 元 < ${couponMinSpend} 元）`);
            }
        } else if (couponType === '贈點' && couponMinSpend > 0) {
            if (baseForCoupon >= couponMinSpend) {
                finalCouponBonus = couponBonus;
                console.log(`✅ 贈點券達標！${baseForCoupon} 元 ≥ ${couponMinSpend} 元，贈送 ${couponBonus} 點`);
            } else {
                console.log(`❌ 贈點券未達標（${baseForCoupon} 元 < ${couponMinSpend} 元）`);
            }
        }
        
        // 🔥 更新活動折抵欄位
        if (elements.couponDiscountInput) {
            elements.couponDiscountInput.value = couponDiscountAmount;
        }
        
        // 🔥 計算最終實際付款金額
        const finalActual = totalSpend - ticketSpend - redeem - couponDiscountAmount;
        
        // 🔥 計算獲得點數
        basePoints = Math.floor(Math.max(0, finalActual) * earnRate * levelRate * eventMultiplier);
        totalNewPoints = basePoints + finalCouponBonus;
        
        console.log(`💳 一般模式: 總額 ${totalSpend} - 餐券 ${ticketSpend} - 點數 ${redeem} - 優惠券 ${couponDiscountAmount} = 實付 ${finalActual} 元 → ${basePoints} 點 + 贈點 ${finalCouponBonus} 點 = ${totalNewPoints} 點`);
    }
    
    // ============================================================
    //  🔥 10. 更新 UI（統一處理）
    // ============================================================
    
    if (elements.tipEl) {
        elements.tipEl.innerText = tipMessage;
        elements.tipEl.className = tipClass;
    }
    
    if (elements.maxHintEl) {
        elements.maxHintEl.innerText = maxRedeem;
    }
    
    if (elements.redeemInput && redeem !== redeemAmount) {
        elements.redeemInput.value = redeem;
    }
    
    // 🔥 更新 newPtsEl
    if (elements.newPtsEl) {
        if (finalCouponBonus > 0) {
            elements.newPtsEl.innerHTML = 
                `${basePoints} 點 + 活動贈點 <b style="color:#ff6b00;">${finalCouponBonus}</b> 點 = ` +
                `<b style="color:#1a73e8;">${totalNewPoints}</b> 點`;
        } else {
            elements.newPtsEl.innerText = `${totalNewPoints} 點`;
        }
    }
    
    // 🔥 更新 bonusPointsDisplay
    if (elements.bonusPointsDisplay) {
        if (finalCouponBonus > 0) {
            elements.bonusPointsDisplay.style.display = 'inline';
        } else {
            elements.bonusPointsDisplay.style.display = 'none';
        }
    }
    
    if (elements.afterPtsEl) {
        const currentPts = currentPoints || 0;
        const afterPoints = currentPts - redeem + totalNewPoints;
        elements.afterPtsEl.innerText = `${afterPoints} 點`;
    }
    
    // 🔥 更新 couponBonusDisplay
    if (elements.couponBonusDisplay) {
        if (finalCouponBonus > 0) {
            elements.couponBonusDisplay.textContent = `🎁 活動贈點 +${finalCouponBonus} 點`;
            elements.couponBonusDisplay.style.display = 'block';
        } else {
            elements.couponBonusDisplay.style.display = 'none';
        }
    }
    
    // ============================================================
    //  🔥 11. 返回計算結果
    // ============================================================
    const result = {
        isTicketMode,
        totalSpend,
        ticketSpend,
        couponDiscount: finalCouponDiscount,
        couponMinSpend,
        couponName,
        couponType,
        redeem,
        maxRedeem,
        basePoints,
        couponBonus: couponBonus,
        finalCouponBonus: finalCouponBonus,
        totalNewPoints,
        baseAmount,
        afterPoints: (currentPoints || 0) - redeem + totalNewPoints,
        couponEligible: couponType && couponMinSpend > 0 && (totalSpend - ticketSpend) >= couponMinSpend
    };
    
    window.calcResult = result;
    
    console.log('📊 計算結果:', result);
    return result;
}

function generateTransactionId(customerId) {
    const now = new Date();
    const day = String(now.getDate()).padStart(2, '0');
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const timeKey = day + '_' + hours + minutes + seconds;
    const customerPrefix = customerId.substring(0, 5);
    return customerPrefix + '_' + timeKey;
}

    document.getElementById('after-pts').innerText = '0 點';
    showToast('✅ 集點完成！');
} else {
    // 一般流程：完整重置
    resetMember();
    showToast('✅ 集點完成，已清除會員資料');
}
                    
                    // 🔥 修正點：如果有優惠券且不是重複提交，顯示優惠券已使用
                    if (couponType && !isDuplicate) {
                        const statusEl = document.getElementById('coupon-status-display');
                        if (statusEl) {
                            statusEl.innerHTML = '🎉 優惠券已成功使用！';
                            statusEl.style.color = '#2e7d32';
                            statusEl.className = 'coupon-status eligible';
                        }
                    }
                    
                } catch (err) {
                    console.warn('⚠️ 重置狀態時發生錯誤:', err);
                }
            }, 500);
            
        } else {
            // 失敗
            alert(`❌ 集點失敗：${result.message || '未知錯誤'}`);
        }
        
    } catch (error) {
        // ---------- 11. 錯誤處理 ----------
        hideLoading();
        console.error('❌ 請求失敗:', error);
        console.error('錯誤堆疊:', error.stack);
        
        // 🔥 修正點：顯示更詳細的錯誤訊息
        let errorMsg = '網路錯誤，請檢查連線後再試';
        if (error.message) {
            errorMsg = error.message;
        }
        alert(`❌ 錯誤：${errorMsg}`);
        
    } finally {
        // ---------- 12. 解鎖按鈕（確保一定會執行） ----------
        const btn = document.getElementById('submitBtn');
        if (btn) {
            btn.disabled = false;
            btn.textContent = '確認過卡';
        }
        hideLoading();
    }
}

        // ============================================================

        window.activeCoupon = null;

        window.calcResult = null;

        const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;

        }
        
        const scanBtn = document.getElementById('scanBtn');
        if (scanBtn) {
            scanBtn.textContent = '📷 掃描會員';
            scanBtn.disabled = false;
        }
        
        // 隱藏會員 UI
        const memberUI = document.getElementById('member-ui');
        if (memberUI) {
            memberUI.style.display = 'none';
        }
        
        // ============================================================
        //  8️⃣ 清理 URL 殘留參數（避免重複疊加）
        // ============================================================
        if (window.history && window.history.replaceState) {
            try {
                var url = new URL(window.location.href);
                var paramsToRemove = [
                    'userId', 'fromCoupon', 'couponDocId', 'minSpend',
                    'bonusPoints', 'discountAmount', 'couponType',
                    'couponName', 'couponContent', 'memberName',
                    'currentPoints', 'memberLevel', 'totalSpend'
                ];
                paramsToRemove.forEach(function(param) {
                    url.searchParams.delete(param);
                });
                window.history.replaceState({}, document.title, url.toString());
                console.log('✅ URL 殘留參數已清除');
            } catch (err) {
                console.warn('⚠️ URL 清理時發生非致命例外:', err);

        // ============================================================

        // ============================================================
        isProcessing = false;
        
        // ============================================================

            focusHiddenInput();
        }, 300);
        
        console.log('🔄 會員資料已完整重置');
    } catch (error) {
        console.warn('⚠️ 重置會員資料時發生錯誤:', error);
    }
}

function init() {
    console.log("📌 電腦版 staff_pc.html 啟動");
    
    // 🔥 檢查是否被鎖定
    const isLockedStorage = localStorage.getItem('isLocked');
    if (isLockedStorage === 'true') {
        console.log('🔒 頁面已被鎖定，顯示鎖屏畫面');
        isLocked = true;
        // 直接顯示鎖屏，不進行自動登入
        showIdleLockScreen();
        return;
    }
    
    var submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '⏳ 資料載入中...';
    }
    
    // 從 localStorage 讀取登入狀態
    var loginId = localStorage.getItem('staffLoginId');
    var staffName = localStorage.getItem('staffName');
    var branchName = localStorage.getItem('staffBranch');
    var role = localStorage.getItem('staffRole') || '夥伴';
    
    if (!loginId) {
        console.log("❌ 無登入憑證，請先登入");
        if (submitBtn) {
            submitBtn.innerHTML = '請先登入';
        }
        setTimeout(function() {
            window.location.href = 'staff_login_pc.html';
        }, 1500);
        return;
    }
    
    // 設定店員資訊
    staff.name = staffName || '';
    staff.branch = branchName || '老娘鍋河堤店';
    staff.loginId = loginId;
    staff.role = role;
    staff.deviceId = getDeviceId();
    isLoggedIn = true;
    
    var staffNameEl = document.getElementById('staff-name');
    var shopNameEl = document.getElementById('shop-name');
    var roleTextEl = document.getElementById('role-text');
    if (staffNameEl) staffNameEl.innerText = staff.name || '夥伴';
    if (shopNameEl) shopNameEl.innerText = staff.branch || '老娘領地';
    if (roleTextEl) roleTextEl.innerText = staff.role || '夥伴';
    
    if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '確認過卡';
    }
    
    console.log("✅ 電腦版初始化完成，店員:", staff.name);
    
    // ============================================================
    //  🔥 檢查是否從優惠券跳轉回來
    // ============================================================
    const urlParams = new URLSearchParams(window.location.search);
    const fromCoupon = urlParams.get('fromCoupon');
    const userId = urlParams.get('userId');

    if (fromCoupon === 'true' && userId) {
        console.log("🎯 從優惠券跳轉回來，userId:", userId);
        
        const couponDocId = urlParams.get('couponDocId') || '';
        const minSpend = parseFloat(urlParams.get('minSpend')) || 0;
        const bonusPoints = parseFloat(urlParams.get('bonusPoints')) || 0;
        const discountAmount = parseFloat(urlParams.get('discountAmount')) || 0;
        const couponType = urlParams.get('couponType') || '';
        const couponName = urlParams.get('couponName') || '優惠券';
        const couponContent = urlParams.get('couponContent') || '';
        
        window.activeCoupon = {
            couponName: couponName,
            couponContent: couponContent,
            minSpend: minSpend,
            bonusPoints: bonusPoints,
            discountAmount: discountAmount,
            type: couponType,
            couponDocId: couponDocId
        };
        window.activeCouponDocId = couponDocId;
        
        console.log("✅ 已還原優惠券資料:", window.activeCoupon);
        
        loadMemberData(userId);
        
        if (window.activeCoupon) {
            displayCouponInfo(window.activeCoupon);
        }
        
        if (window.history && window.history.replaceState) {
            try {
                var url = new URL(window.location.href);
                url.searchParams.delete('fromCoupon');
                window.history.replaceState({}, document.title, url.toString());
            } catch (err) {}
        }
        
        hideLoading();
        
        // 🔥 啟動閒置計時器
        resetIdleTimer();
        document.addEventListener('mousemove', resetIdleTimer);
        document.addEventListener('mousedown', resetIdleTimer);
        document.addEventListener('keydown', resetIdleTimer);
        document.addEventListener('scroll', resetIdleTimer);
        document.addEventListener('click', resetIdleTimer);
        
        setTimeout(function() {
            if (document.getElementById('scanInput')) {
                document.getElementById('scanInput').focus();
            }
        }, 500);
        
        return;
    }
    
    // ============================================================
    //  🔥 非優惠券流程（正常登入）
    // ============================================================
    preloadSwitchableStaff();
    getCouponPrefixes();
    hideLoading();
    
    // 🔥 啟動閒置計時器
    resetIdleTimer();
    document.addEventListener('mousemove', resetIdleTimer);
    document.addEventListener('mousedown', resetIdleTimer);
    document.addEventListener('keydown', resetIdleTimer);
    document.addEventListener('scroll', resetIdleTimer);
    document.addEventListener('click', resetIdleTimer);
    
    setTimeout(function() {
        if (document.getElementById('scanInput')) {
            document.getElementById('scanInput').focus();
        }
    }, 500);
}  // ← init() 結束

// ============================================================
// 🔥 啟動
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    init();
});
